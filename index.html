<!DOCTYPE html>
<html lang="vi">
<head>

<title>HỆ THỐNG QUẢN LÝ LIÊN ĐỘI TRƯỜNG THCS XUÂN TÂN</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liên Đội Xuân Tân">
<style>
:root{
  --navy:#0f172a; --navy-2:#1e293b; --emerald:#059669; --emerald-2:#10b981; --emerald-light:#ecfdf5;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1; --slate-400:#94a3b8;
  --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --slate-900:#0f172a;
  --red:#dc2626; --red-light:#fef2f2; --amber:#d97706; --amber-light:#fffbeb; --blue:#2563eb; --blue-light:#eff6ff;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--slate-50);color:var(--slate-800);}
button,input,select{font-family:inherit;font-size:inherit;}
#root{min-height:100vh;display:flex;flex-direction:column;}
.icon{display:inline-block;vertical-align:-3px;flex-shrink:0;}
.icon-fill{fill:currentColor;}
.stack{display:flex;flex-direction:column;gap:16px;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.row-between{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;}

/* Header */
.app-header{background:var(--navy);color:#fff;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15);position:sticky;top:0;z-index:20;min-height:44px;}
.header-left{display:flex;align-items:center;gap:8px;min-width:0;}
.logo-badge{width:26px;height:26px;border-radius:8px;background:var(--emerald-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.header-titles h1{font-size:11px;font-weight:700;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-titles p{font-size:9.5px;color:var(--slate-400);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.role-switch{display:flex;background:var(--navy-2);border-radius:8px;padding:3px;gap:3px;}
.role-btn{border:none;background:transparent;color:var(--slate-300);font-size:12px;font-weight:600;padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.role-btn.active-admin{background:var(--emerald-2);color:#fff;}
.role-btn.active-staff{background:var(--blue);color:#fff;}
.auth-status{display:flex;align-items:center;gap:8px;}
.auth-badge{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;line-height:1.25;max-width:140px;}
.auth-badge-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.auth-badge-role{font-size:10px;padding:1px 7px;border-radius:20px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.auth-badge-role.role-guest{background:var(--slate-700);color:var(--slate-300);}
.auth-badge-role.role-admin{background:var(--emerald-2);color:#fff;}
.auth-badge-role.role-staff{background:var(--blue);color:#fff;}
.btn-login{border:none;background:var(--emerald-2);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-login:hover{background:var(--emerald);}
.btn-logout{border:1px solid var(--slate-600);background:transparent;color:var(--slate-200);font-size:11px;font-weight:600;padding:6px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.btn-logout:hover{background:var(--navy-2);}
.header-user{display:none;flex-direction:column;align-items:flex-end;font-size:11px;padding-left:10px;border-left:1px solid var(--slate-700);}
.header-user-name{font-weight:600;}
.header-user-role{color:var(--slate-400);}
.login-mode-tabs{display:flex;background:var(--slate-100);border-radius:9px;padding:3px;gap:3px;margin-bottom:2px;}
.login-mode-tab{flex:1;border:none;background:transparent;color:var(--slate-600);font-size:12px;font-weight:600;padding:8px 6px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.login-mode-tab.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--slate-900);}
@media(min-width:1024px){.header-user{display:flex;} .header-titles h1{font-size:12.5px;}}
@media(max-width:640px){.role-label{display:none;} .header-titles p{display:none;}}
@media(max-width:420px){.auth-badge-name{display:none;}}

/* Layout */
.app-body{display:flex;flex:1;min-height:0;}
.sidebar{width:60px;background:#fff;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;padding:14px 0;flex-shrink:0;}
.side-btn{display:flex;align-items:center;gap:10px;background:transparent;border:none;padding:11px 10px;margin:0 6px 4px;border-radius:10px;cursor:pointer;color:var(--slate-500);font-size:13px;font-weight:600;position:relative;width:calc(100% - 12px);text-align:left;}
.side-btn.active{background:var(--emerald-light);color:var(--emerald);}
.side-label{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lock-dot{margin-left:auto;color:var(--amber);display:none;}
.sidebar-footer{margin-top:auto;padding:14px;font-size:10px;color:var(--slate-400);display:none;border-top:1px solid var(--slate-100);}
@media(min-width:768px){.sidebar{width:220px;} .side-label{display:inline;} .lock-dot{display:inline-flex;} .sidebar-footer{display:block;}}
.main-content{flex:1;min-width:0;overflow-y:auto;padding:14px;}
@media(min-width:768px){.main-content{padding:24px;}}

/* Generic */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:15px;}
.page-title{font-size:17px;font-weight:800;color:var(--slate-800);margin:0;}
.page-sub{font-size:13px;color:var(--slate-500);margin:3px 0 0;}
.kpi-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.upload-grid{display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:640px){.upload-grid{grid-template-columns:1fr 1fr;}}
.dash-split{display:grid;gap:14px;grid-template-columns:1fr;}
@media(min-width:1024px){.dash-split{grid-template-columns:2fr 1fr;}}
.score-split{display:grid;gap:14px;grid-template-columns:1fr;align-items:start;}
@media(min-width:1024px){.score-split{grid-template-columns:2fr 3fr;}}
.field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 13px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:#fff;color:var(--slate-700);white-space:nowrap;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-outline{border-color:var(--slate-300);}
.btn-outline:hover{background:var(--slate-50);}
.btn-primary{background:var(--emerald-2);color:#fff;}
.btn-primary:hover{background:var(--emerald);}
.btn-dark{background:var(--slate-800);color:#fff;}
.btn-danger{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-link{background:none;border:none;color:var(--emerald);font-size:12px;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.icon-btn{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:6px;color:var(--slate-500);display:inline-flex;line-height:1;}
.icon-btn:hover{background:var(--slate-100);}
.icon-btn.danger:hover{background:var(--red-light);color:var(--red);}
.icon-btn.blue:hover{background:var(--blue-light);color:var(--blue);}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap;}
.input,.select{width:100%;border:1px solid var(--slate-300);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;color:var(--slate-800);}
.input:disabled,.select:disabled{background:var(--slate-100);color:var(--slate-500);}
.label{font-size:11px;font-weight:600;color:var(--slate-500);display:block;margin-bottom:4px;}
.kpi{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:14px;}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.kpi-val{font-size:21px;font-weight:800;color:var(--slate-800);margin:10px 0 0;}
.kpi-label{font-size:12px;color:var(--slate-500);margin:0;}
.kpi-sub{font-size:10.5px;color:var(--slate-400);margin:1px 0 0;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;color:var(--slate-400);font-weight:600;border-bottom:1px solid var(--slate-100);padding:7px 6px;white-space:nowrap;}
td{padding:7px 6px;border-bottom:1px solid var(--slate-50);}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--slate-50);}
.tbl-wrap{overflow-x:auto;}
.hide-sm{display:none;}
.hide-md{display:none;}
@media(min-width:640px){.hide-sm{display:table-cell;}}
@media(min-width:768px){.hide-md{display:table-cell;}}

.progress-track{height:6px;width:100%;background:var(--slate-200);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;}

.toggle{width:40px;height:24px;border-radius:99px;border:none;position:relative;cursor:pointer;background:var(--slate-300);flex-shrink:0;padding:0;}
.toggle.on{background:var(--emerald-2);}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.toggle.on .knob{transform:translateX(16px);}

.upload-zone{border:2px dashed var(--slate-300);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:#fff;}
.upload-zone:hover{border-color:var(--emerald-2);background:var(--emerald-light);}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal.modal-sm{max-width:380px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--slate-100);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;}
.modal-head strong{display:flex;align-items:center;gap:8px;font-size:14px;}
.modal-body{padding:18px;}

.toast{position:fixed;bottom:18px;right:18px;background:var(--slate-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:60;max-width:88vw;}

.checklist-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;}
.chk-box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--slate-300);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:#fff;padding:0;}
.chk-box.done{background:var(--emerald-2);border-color:var(--emerald-2);color:#fff;}
.done-text{text-decoration:line-through;color:var(--slate-400);}

.sync-log{background:var(--slate-900);border-radius:10px;padding:10px;height:150px;overflow-y:auto;font-family:Consolas,monospace;font-size:11px;color:#6ee7b7;}

.entry-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--slate-50);border-radius:8px;padding:6px 9px;font-size:12px;margin-bottom:5px;}
.pillar-row{margin-bottom:8px;}
.pillar-row .pillar-top{display:flex;justify-content:space-between;font-size:11px;color:var(--slate-500);margin-bottom:3px;}

@media print{
  .no-print{display:none !important;}
  .main-content{padding:0;overflow:visible;}
  body{background:#fff;}
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:4px;}
</style>
</head>

function genStudents(){
  var list = []; var idc = 1;
  var classList = state.classes;
  var n = classList.length;
  var base = Math.floor(1200/n), rem = 1200 - base*n;
  classList.forEach(function(cls, ci){
    var count = base + (ci < rem ? 1 : 0);
    var khoiNum = Number(cls.khoi) || 6;
    for(var i=0;i<count;i++){
      var g = genName();
      var roll = rand();
      var chucVu = roll>0.97? "Chi đội trưởng" : roll>0.93? "Chi đội phó" : "Đội viên";
      list.push({
        id: "DV"+String(idc).padStart(4,"0"),
        hoTen: g.fullName, gioiTinh: g.gender, lop: cls.code, chucVu: chucVu,
        ngaySinh: String(1+Math.floor(rand()*28)).padStart(2,"0")+"/"+String(1+Math.floor(rand()*12)).padStart(2,"0")+"/"+(2016-(khoiNum-6))
      });
      idc++;
    }
  });
  return list;
}

function buildDefaultWeeks(count, startYear){
  count = count || 37;
  var weeks = [];
  var start;
  if(startYear){
    start = new Date(startYear, 8, 1);            // Thứ Hai đầu tiên của tháng 9
    while(start.getDay()!==1) start.setDate(start.getDate()+1);
  } else {
    start = new Date(2025, 8, 1); // Thứ Hai 01/09/2025 — tuần 1 (năm học 2025-2026)
  }
  function fmt(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); }
  for(var i=1;i<=count;i++){
    var end = new Date(start);
    end.setDate(start.getDate()+4);
    weeks.push("Tuần "+i+" ("+fmt(start)+" - "+fmt(end)+")");
    start = new Date(start);
    start.setDate(start.getDate()+7);
  }
  return weeks;
}

var CLOUD_LS_KEY = "lienDoiXuanTan_cloudConfig_v1";

var cloudDb = null, cloudUnsub = null, cloudSaveTimer = null, cloudSuppressPush = false, cloudLastSync = null, cloudPollTimer = null;

function cloudDocPath(){ return (cloudConfig && cloudConfig.docPath) || 'lienDoiXuanTan/state'; }
function cloudStatusInfo(){
  var map = {

function initCloud(){
  if(!cloudConfig){ cloudStatus='off'; return; }
  if(cloudConfig.provider==='jsonbin'){ initCloudJsonbin(); return; }
  if(typeof firebase==='undefined'){ cloudStatus = 'error'; return; }
  try{
    var app = (firebase.apps && firebase.apps.length)? firebase.apps[0] : firebase.initializeApp(cloudConfig);
    cloudDb = firebase.firestore();
    cloudStatus = 'connecting';
    subscribeCloud();
  }catch(e){ cloudStatus = 'error'; }
}
function subscribeCloud(){
  if(!cloudDb) return;
  if(cloudUnsub) cloudUnsub();
  cloudUnsub = cloudDb.doc(cloudDocPath()).onSnapshot(function(snap){
    cloudStatus = 'connected';
    if(snap.exists){
      var data = snap.data();
      if(data && data.json && data.updatedBy !== DEVICE_ID){
        try{
          var incoming = JSON.parse(data.json);
          cloudSuppressPush = true;
          state = incoming;
          try{ localStorage.setItem(LS_KEY, data.json); }catch(e){}
          cloudSuppressPush = false;
        }catch(e){}
      }
      cloudLastSync = new Date();
    } else {
      pushStateToCloud(true); // chưa có dữ liệu trên đám mây — đẩy dữ liệu hiện tại lên để khởi tạo
    }
    render();
  }, function(){ cloudStatus = 'error'; render(); });
}
/* --- JSONBin.io: đơn giản hơn, dùng fetch REST thuần, đồng bộ theo chu kỳ (polling) mỗi 10 giây --- */
function jsonbinHeaders(extra){
  var h = { 'X-Master-Key': cloudConfig.apiKey };
  if(extra) for(var k in extra) h[k] = extra[k];
  return h;
}
function initCloudJsonbin(){
  cloudStatus = 'connecting';
  pullJsonbin();
  if(cloudPollTimer) clearInterval(cloudPollTimer);
  cloudPollTimer = setInterval(pullJsonbin, 10000);
}
function pullJsonbin(){
  if(!cloudConfig || cloudConfig.provider!=='jsonbin') return;
  fetch('https://api.jsonbin.io/v3/b/'+cloudConfig.binId+'/latest', { headers: jsonbinHeaders({'X-Bin-Meta':'false'}) })
    .then(function(r){
      if(r.status===404){ pushStateToCloud(true); return null; }
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    })
    .then(function(data){
      cloudStatus = 'connected';
      if(data && data.updatedBy && data.updatedBy !== DEVICE_ID && data.state){
        cloudSuppressPush = true;
        state = data.state;
        try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
        cloudSuppressPush = false;
      } else if(data && !data.state){
        pushStateToCloud(true); // Bin còn trống (mới tạo) — đẩy dữ liệu hiện tại lên để khởi tạo
      }
      if(data) cloudLastSync = new Date();
      render();
    })
    .catch(function(){ cloudStatus = 'error'; render(); });
}
function pushJsonbin(){
  if(!cloudConfig || cloudConfig.provider!=='jsonbin' || cloudSuppressPush) return;
  var payload = { state: state, updatedBy: DEVICE_ID, updatedAt: new Date().toISOString() };
  fetch('https://api.jsonbin.io/v3/b/'+cloudConfig.binId, {
    method:'PUT',
    headers: jsonbinHeaders({'Content-Type':'application/json', 'X-Bin-Versioning':'false'}),
    body: JSON.stringify(payload)
  }).then(function(r){ if(!r.ok) throw new Error('http '+r.status); cloudLastSync = new Date(); cloudStatus='connected'; })
    .catch(function(){ cloudStatus='error'; render(); });
}
function pushStateToCloud(immediate){
  if(!cloudConfig || cloudSuppressPush) return;
  clearTimeout(cloudSaveTimer);
  var doSave = function(){
    if(cloudConfig.provider==='jsonbin'){ pushJsonbin(); return; }
    if(!cloudDb) return;
    try{
      cloudDb.doc(cloudDocPath()).set({ json: JSON.stringify(state), updatedBy: DEVICE_ID, updatedAt: new Date().toISOString() })
        .then(function(){ cloudLastSync = new Date(); cloudStatus='connected'; })
        .catch(function(){ cloudStatus='error'; render(); });
    }catch(e){ cloudStatus='error'; }
  };
  if(immediate) doSave(); else cloudSaveTimer = setTimeout(doSave, 1200);
}

  ui.dashboard.configBusy = true;

function computeClassScores(week){
  var weekLogs = state.logs[week] || {};
  var maxTotal = PILLARS.reduce(function(s,p){ return s + (Number(state.pillarMaxScores[p])||0); }, 0);
  var rows = state.classes.map(function(c){
    var entries = weekLogs[c.code] || [];
    var pillarScores = {};
    PILLARS.forEach(function(p){
      var max = Number(state.pillarMaxScores[p])||0;
      var delta = entries.filter(function(e){ return e.pillar===p; }).reduce(function(s,e){ return s+e.points; }, 0);
      pillarScores[p] = Math.max(0, Math.min(max, max+delta));
    });
    var total = PILLARS.reduce(function(s,p){ return s+pillarScores[p]; }, 0);
    var percent = maxTotal>0? (total/maxTotal*100) : 0;
    var cls = classification(percent);
    return Object.assign({}, c, { pillarScores:pillarScores, total:total, maxTotal:maxTotal, entriesCount:entries.length, label:cls.label, color:cls.color });
  });
  rows.sort(function(a,b){ return b.total-a.total; });
  return rows.map(function(r,i){ return Object.assign({}, r, {rank:i+1}); });
}

/* ---------------------------- Render pipeline ---------------------------- */
function captureFocus(){
  var el = document.activeElement;
  if(!el || el===document.body || !el.id) return null;
  return { id:el.id, start:(typeof el.selectionStart==='number'?el.selectionStart:null), end:(typeof el.selectionEnd==='number'?el.selectionEnd:null) };
}
function restoreFocus(info){
  if(!info) return;
  var el = $id(info.id);
  if(el){
    el.focus();
    if(info.start!==null && el.setSelectionRange){
      try{ el.setSelectionRange(info.start, info.end); }catch(e){}
    }
  }
}
function render(){
  var f = captureFocus();
  $id("root").innerHTML = AppHTML();
  restoreFocus(f);
}

  if(f.next.length<6){ ui.changePw.error='Mật khẩu mới cần tối thiểu 6 ký tự.'; render(); return; }
  if(f.next!==f.confirm){ ui.changePw.error='Xác nhận mật khẩu mới không khớp.'; render(); return; }
  if(session.role==='admin'){
    state.adminAccount = Object.assign({}, state.adminAccount, { password: f.next });
  } else {
    var id = session.staffAccount.id;
    state.accounts = state.accounts.map(function(a){ return a.id===id? Object.assign({}, a, { password: f.next }) : a; });
    session.staffAccount = state.accounts.find(function(a){ return a.id===id; });
  }
  persist();
  session.changePwModalOpen = false;
  notify('Đã đổi mật khẩu đăng nhập thành công.');
  render();

/* ---------------------------- Scoring ---------------------------- */
function setCurrentWeek(w){ state.currentWeek=w; ui.scoring.directInputs=null; persist(); render(); }
function setScoringClass(code){ ui.scoring.selectedClass=code; ui.scoring.directInputs=null; render(); }

function addEntryToLog(label, points, pillar){
  var s = ui.scoring;
  var isAdmin = session.role==='admin';
  if(state.savedWeeks.indexOf(state.currentWeek)!==-1){ denyLockedWeek('Chỉnh sửa điểm'); return; }
  if(!requireScoreEdit(s.selectedClass, 'Chấm điểm cho Chi đội '+s.selectedClass)) return;
  var entry = { id: Math.random().toString(36).slice(2), pillar:pillar, label:label, points:Number(points), note:s.note||'', by:(isAdmin?'Admin':(session.staffAccount?session.staffAccount.username:'')), time:new Date().toLocaleString('vi-VN') };
  if(!state.logs[state.currentWeek]) state.logs[state.currentWeek] = {};
  if(!state.logs[state.currentWeek][s.selectedClass]) state.logs[state.currentWeek][s.selectedClass] = [];
  state.logs[state.currentWeek][s.selectedClass].push(entry);
  ui.scoring.note = '';
  persist();
  notify('Đã ghi nhận: '+label+' ('+(points>0?'+':'')+points+'đ) cho Chi đội '+s.selectedClass);
}
function addSelectedInfraction(){
  var all = INFRACTIONS.concat(state.customInfractions);
  var found = all.filter(function(f){ return (f.pillar+'||'+f.label)===ui.scoring.pillarFilter; })[0];
  if(found) addEntryToLog(found.label, found.points, found.pillar);
}
function addCustomInfraction(){
  var s = ui.scoring;
  if(!s.customLabel || s.customPoints==='') return;
  var label=s.customLabel, points=Number(s.customPoints), pillar=s.customPillar;
  addEntryToLog(label, points, pillar);
  if(!state.customInfractions.some(function(f){ return f.label===label && f.pillar===pillar; })){
    state.customInfractions = state.customInfractions.concat([{pillar:pillar, label:label, points:points}]);
  }
  ui.scoring.customLabel=''; ui.scoring.customPoints='';
  persist();
}
function setDirectScore(pillar){
  var s = ui.scoring;
  if(state.savedWeeks.indexOf(state.currentWeek)!==-1){ denyLockedWeek('Chỉnh sửa điểm'); return; }
  var isAdmin = session.role==='admin';
  if(!requireScoreEdit(s.selectedClass, 'Nhập điểm trực tiếp cho Chi đội '+s.selectedClass)) return;
  var raw = s.directInputs? s.directInputs[pillar] : undefined;
  if(raw===undefined || String(raw).trim()===''){ alert('Vui lòng nhập điểm.'); return; }
  var value = Number(raw);
  if(isNaN(value)){ alert('Điểm nhập không hợp lệ.'); return; }
  var max = Number(state.pillarMaxScores[pillar])||0;
  value = Math.max(0, Math.min(max, Math.round(value)));
  var ranking = computeClassScores(state.currentWeek);
  var row = ranking.filter(function(r){ return r.code===s.selectedClass; })[0];
  var current = row? row.pillarScores[pillar] : max;
  var delta = value - current;
  s.directInputs[pillar] = value;
  if(delta===0){ notify('Điểm '+pillar+' không đổi ('+value+'đ).'); return; }
  var entry = { id: Math.random().toString(36).slice(2), pillar:pillar, label:'Nhập điểm trực tiếp', points:delta, note:'Đặt điểm còn '+value+'đ (trước đó '+current+'đ)', by:(isAdmin?'Admin':(session.staffAccount?session.staffAccount.username:'')), time:new Date().toLocaleString('vi-VN') };
  if(!state.logs[state.currentWeek]) state.logs[state.currentWeek] = {};
  if(!state.logs[state.currentWeek][s.selectedClass]) state.logs[state.currentWeek][s.selectedClass] = [];
  state.logs[state.currentWeek][s.selectedClass].push(entry);
  persist();
  notify('Đã cập nhật điểm '+pillar+' cho Chi đội '+s.selectedClass+': '+value+'đ');
}
function deleteEntry(id){
  if(!requireAdmin('Xóa nhật ký chấm điểm')) return;
  if(state.savedWeeks.indexOf(state.currentWeek)!==-1){ denyLockedWeek('Xóa nhật ký chấm điểm'); return; }
  var wk = state.logs[state.currentWeek];
  var cls = ui.scoring.selectedClass;
  if(wk && wk[cls]){ wk[cls] = wk[cls].filter(function(e){ return e.id!==id; }); persist(); render(); }
}

function renameWeek(oldLabel, newLabelRaw){
  var newLabel = (newLabelRaw||'').trim();
  if(!newLabel){ alert('Tên tuần không được để trống.'); return false; }
  if(newLabel!==oldLabel && state.weeks.indexOf(newLabel)!==-1){ alert('Tuần "'+newLabel+'" đã tồn tại.'); return false; }
  state.weeks = state.weeks.map(function(w){ return w===oldLabel? newLabel : w; });
  if(newLabel!==oldLabel){
    if(state.logs[oldLabel]){ state.logs[newLabel]=state.logs[oldLabel]; delete state.logs[oldLabel]; }
    state.savedWeeks = state.savedWeeks.map(function(w){ return w===oldLabel? newLabel : w; });
    if(state.weekMeta && state.weekMeta[oldLabel]){ state.weekMeta[newLabel] = state.weekMeta[oldLabel]; delete state.weekMeta[oldLabel]; }
    if(state.currentWeek===oldLabel) state.currentWeek=newLabel;
  }
  persist();
  return true;
}
function confirmEditWeek(oldLabel){
  var ok = renameWeek(oldLabel, ui.scoring.weekDraftName);
  if(ok){ ui.scoring.weekEditIdx=null; render(); }
}
function deleteWeek(label){
  if(state.weeks.length<=1){ alert('Phải có ít nhất một tuần thi đua.'); return; }
  if(!confirm('Xóa "'+label+'"? Toàn bộ nhật ký chấm điểm của tuần này sẽ bị xóa vĩnh viễn.')) return;
  state.weeks = state.weeks.filter(function(w){ return w!==label; });
  if(state.logs[label]) delete state.logs[label];
  state.savedWeeks = state.savedWeeks.filter(function(w){ return w!==label; });
  if(state.weekMeta) delete state.weekMeta[label];
  if(state.currentWeek===label){ state.currentWeek = state.weeks[0]; }
  persist();
  render();
}
function addWeek(){
  var name = prompt('Nhập tên tuần mới:', 'Tuần '+(state.weeks.length+1));
  if(!name || !name.trim()) return;
  if(state.weeks.indexOf(name.trim())!==-1){ alert('Tên tuần đã tồn tại.'); return; }
  state.weeks = state.weeks.concat([name.trim()]);
  persist();
  notify('Đã thêm '+name.trim());
}

/* ---------------------------- CSV helpers (không cần thư viện) ---------------------------- */
function toCSV(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = (v===undefined||v===null)? '' : String(v);
      if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
      return v;
    }).join(',');
  }).join('\r\n');
}
function parseCSV(text){
  var lines = text.replace(/\r\n/g,'\n').split('\n').filter(function(l){ return l.trim().length; });
  var rows = [];
  for(var li=0; li<lines.length; li++){
    var line = lines[li], row=[], cur='', q=false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(q){
        if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; }
        else cur+=c;
      } else {
        if(c==='"') q=true;
        else if(c===','){ row.push(cur); cur=''; }
        else cur+=c;
      }
    }
    row.push(cur);
    rows.push(row);
  }
  return rows;
}
function downloadFile(filename, content, mime){
  var blob = new Blob(['\ufeff'+content], { type:(mime||'text/csv')+';charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

  }));

        var data = JSON.parse(text);
        rowsOut = (Array.isArray(data)? data : []).map(function(o){
          return { hoTen:o.hoTen||o.name||'', lop:(o.lop||o.class||targetClass||'').toString().toUpperCase(), gioiTinh:o.gioiTinh||o.gender||'Nam', chucVu:o.chucVu||'Đội viên', ngaySinh:o.ngaySinh||o.dob||'' };
        });
      } else {
        var rows = parseCSV(text);
        if(!rows.length) throw new Error('empty');
        var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
        function idx(k){ for(var i=0;i<header.length;i++){ if(header[i].indexOf(k)>=0) return i; } return -1; }
        var iName = idx('tên')>=0? idx('tên') : 0;
        var iClass = idx('lớp')>=0? idx('lớp') : (idx('chi đội')>=0? idx('chi đội') : 1);
        var iGender = idx('giới');
        var iRole = idx('chức');
        var iDob = idx('sinh');
        rowsOut = rows.slice(1).map(function(cols){
          return {
            hoTen: (cols[iName]||'').trim(),
            lop: (cols[iClass]||targetClass||'').trim().toUpperCase(),
            gioiTinh: (iGender>=0 && cols[iGender])? cols[iGender].trim() : 'Nam',
            chucVu: (iRole>=0 && cols[iRole])? cols[iRole].trim() : 'Đội viên',
            ngaySinh: iDob>=0? (cols[iDob]||'').trim() : ''
          };
        });
      }
      rowsOut = rowsOut.filter(function(s){ return s.hoTen; });
      if(mode==='roster'){ rowsOut = rowsOut.map(function(s){ return Object.assign({}, s, {lop:targetClass}); }); }
      if(!rowsOut.length){ alert('Không tìm thấy dữ liệu hợp lệ trong file.'); return; }
      var stamp = Date.now().toString().slice(-6);
      var newStudents = rowsOut.map(function(s, i){
        return {
          id: 'DVNK'+stamp+i,
          hoTen: s.hoTen,
          lop: s.lop || classCodes()[0],
          gioiTinh: s.gioiTinh==='Nữ'? 'Nữ' : 'Nam',
          chucVu: ['Đội viên','Chi đội trưởng','Chi đội phó'].indexOf(s.chucVu)!==-1? s.chucVu : 'Đội viên',
          ngaySinh: s.ngaySinh || ''
        };
      });
      state.students = newStudents.concat(state.students);
      persist();
      ui.directory.successMsg = 'Đã nhập thành công '+newStudents.length+' bản ghi vào hệ thống.';
      render();
    }catch(err){
      alert('Không đọc được file. Vui lòng dùng file .csv hoặc .json đúng định dạng (có cột Họ và tên, Chi đội).');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function readImageAsCompressedDataUrl(file, maxDim, quality, onDone, onError){
  if(!file){ return; }
  if(!/^image\//.test(file.type)){ if(onError) onError('Vui lòng chọn file hình ảnh (jpg, png...).'); return; }
  if(file.size > 8*1024*1024){ if(onError) onError('Ảnh quá lớn, vui lòng chọn ảnh dưới 8MB.'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var scale = img.width>maxDim? maxDim/img.width : 1;
      var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      var canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      onDone(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ if(onError) onError('Không đọc được ảnh. Vui lòng thử ảnh khác.'); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ if(onError) onError('Không đọc được file.'); };
  reader.readAsDataURL(file);
}

/* ---------------------------- Chương trình Rèn luyện Đội viên ---------------------------- */
function getRldv(code){
  if(!state.rldv[code]){
    state.rldv[code] = {
      chuyenHieu: DEFAULT_CHUYEN_HIEU.map(function(n,i){ return { id:'ch'+i, name:n, done:false }; }),
      recognized: false, recognizedDate: '', note: ''
    };
  }
  return state.rldv[code];
}
function canEditRldv(code){
  return session.role==='admin';
}
function toggleChuyenHieu(code, id){
  if(!canEditRldv(code)){ deny('Cập nhật Chương trình Rèn luyện Đội viên'); return; }
  var r = getRldv(code);
  r.chuyenHieu = r.chuyenHieu.map(function(c){ return c.id===id? Object.assign({},c,{done:!c.done}) : c; });
  persist(); render();
}
function addChuyenHieu(code){
  if(!requireAdmin('Thêm chuyên hiệu rèn luyện')) return;
  var name = prompt('Nhập tên chuyên hiệu mới:');
  if(!name || !name.trim()) return;
  var r = getRldv(code);
  r.chuyenHieu = r.chuyenHieu.concat([{ id:'ch'+Date.now(), name:name.trim(), done:false }]);
  persist(); render();
}
function removeChuyenHieu(code, id){
  if(!requireAdmin('Xóa chuyên hiệu rèn luyện')) return;
  var r = getRldv(code);
  r.chuyenHieu = r.chuyenHieu.filter(function(c){ return c.id!==id; });
  persist(); render();
}
function setRldvRecognized(code, val){
  if(!requireAdmin('Công nhận hoàn thành Chương trình Rèn luyện Đội viên')) return;
  var r = getRldv(code);
  r.recognized = val;
  r.recognizedDate = val? new Date().toLocaleDateString('vi-VN') : '';
  persist();
  notify(val? ('Đã công nhận Chi đội '+code+' hoàn thành Chương trình Rèn luyện Đội viên') : ('Đã hủy công nhận Chi đội '+code));
  render();
}

  var r = getRldv(code);

    + (isAdmin? '<button class="btn-link" style="margin-top:8px;" onclick="addChuyenHieu(\''+code+'\')">'+icon('plus',12)+' Thêm chuyên hiệu</button>' : '')

/* ---------------------------- Nghi thức Đội — Tìm hiểu & Học tập ---------------------------- */
function toggleNghiThucSection(idx){
  ui.nghithuc.openIdx = (ui.nghithuc.openIdx===idx? -1 : idx);
  render();
}
function selectQuizAnswer(qIdx, optIdx){
  if(ui.nghithuc.submitted) return;
  ui.nghithuc.quizAnswers[qIdx] = optIdx;
  render();
}
function submitQuiz(){
  var answered = Object.keys(ui.nghithuc.quizAnswers).length;
  if(answered < state.quizQuestions.length){
    if(!confirm('Bạn mới trả lời '+answered+'/'+state.quizQuestions.length+' câu. Vẫn nộp bài?')) return;
  }
  ui.nghithuc.submitted = true;
  render();
}
function resetQuiz(){
  ui.nghithuc.quizAnswers = {};
  ui.nghithuc.submitted = false;
  render();
}
/* --- Quản lý ngân hàng câu hỏi trắc nghiệm (Admin) --- */
function openQuizManage(){
  if(!requireAdmin('Quản lý câu hỏi trắc nghiệm')) return;
  ui.nghithuc.manageOpen = true;
  ui.nghithuc.editingId = null;
  ui.nghithuc.form = { q:'', options:['','','',''], correct:0 };
  ui.nghithuc.formError = '';
  render();
}
function closeQuizManage(){ ui.nghithuc.manageOpen=false; render(); }
function startAddQuizQuestion(){
  ui.nghithuc.editingId = null;
  ui.nghithuc.form = { q:'', options:['','','',''], correct:0 };
  ui.nghithuc.formError = '';
  render();
}
function startEditQuizQuestion(id){
  var q = state.quizQuestions.filter(function(x){ return x.id===id; })[0];
  if(!q) return;
  ui.nghithuc.editingId = id;
  ui.nghithuc.form = { q:q.q, options:q.options.slice(), correct:q.correct };
  ui.nghithuc.formError = '';
  render();
}
function updateQuizFormOption(idx, val){ ui.nghithuc.form.options[idx]=val; }
function submitQuizQuestion(){
  var f = ui.nghithuc.form;
  var qText = (f.q||'').trim();
  var opts = f.options.map(function(o){ return (o||'').trim(); });
  if(!qText){ ui.nghithuc.formError='Vui lòng nhập nội dung câu hỏi.'; render(); return; }
  if(opts.some(function(o){ return !o; })){ ui.nghithuc.formError='Vui lòng nhập đủ 4 phương án.'; render(); return; }
  if(ui.nghithuc.editingId){
    state.quizQuestions = state.quizQuestions.map(function(q){
      return q.id===ui.nghithuc.editingId? Object.assign({}, q, { q:qText, options:opts, correct:f.correct }) : q;
    });
    notify('Đã cập nhật câu hỏi.');
  } else {
    state.quizQuestions = state.quizQuestions.concat([{ id:'q'+Date.now().toString(36), q:qText, options:opts, correct:f.correct }]);
    notify('Đã thêm câu hỏi mới vào ngân hàng trắc nghiệm.');
  }
  persist();
  ui.nghithuc.editingId = null;
  ui.nghithuc.form = { q:'', options:['','','',''], correct:0 };
  ui.nghithuc.formError = '';
  render();
}
function askDeleteQuizQuestion(id){
  if(!requireAdmin('Xóa câu hỏi trắc nghiệm')) return;
  if(state.quizQuestions.length<=1){ alert('Cần giữ lại ít nhất 1 câu hỏi.'); return; }
  if(!confirm('Xóa câu hỏi này khỏi ngân hàng trắc nghiệm?')) return;
  state.quizQuestions = state.quizQuestions.filter(function(q){ return q.id!==id; });
  if(ui.nghithuc.editingId===id){ ui.nghithuc.editingId=null; ui.nghithuc.form={q:'',options:['','','',''],correct:0}; }
  persist();
  notify('Đã xóa câu hỏi.');
  render();
}

          + '<div class="row" style="gap:8px;">'

function submitNewDocument(){
  var f = ui.documents.form;
  ui.documents.error = '';
  if(!f.title.trim()){ ui.documents.error = 'Vui lòng nhập tên tài liệu.'; render(); return; }
  if(!f.url.trim() && !f.fileData){ ui.documents.error = 'Vui lòng dán liên kết hoặc tải lên 1 file.'; render(); return; }
  var isAdmin = session.role==='admin';
  var doc = {
    id: 'TL'+Math.floor(1000+rand()*8999),
    title: f.title.trim(),
    category: f.category || DOC_CATEGORIES[0],
    url: (f.url||'').trim(),
    note: (f.note||'').trim(),
    fileData: f.fileData||'', fileName: f.fileName||'', fileType: f.fileType||'', fileSizeKB: f.fileSizeKB||0,
    addedBy: isAdmin? 'Admin' : (session.staffAccount? session.staffAccount.username : ''),
    addedAt: new Date().toLocaleDateString('vi-VN')
  };
  state.documents = state.documents.concat([doc]);
  persist();
  notify('Đã thêm tài liệu: '+doc.title);
  ui.documents.form = { title:'', category:DOC_CATEGORIES[0], url:'', note:'', fileData:'', fileName:'', fileType:'', fileSizeKB:0 };
  render();
}
var DOC_FILE_MAX_BYTES = 2.5*1024*1024;
function handleDocumentFileSelect(fileList){
  var file = fileList && fileList[0];
  if(!file) return;
  ui.documents.error = '';
  if(file.size > DOC_FILE_MAX_BYTES){
    ui.documents.error = 'File "'+file.name+'" quá lớn ('+(Math.round(file.size/1024/1024*10)/10)+'MB). Vui lòng chọn file dưới 2.5MB, hoặc dùng ô "Liên kết" để dán link Google Drive cho file lớn hơn.';
    render();
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    ui.documents.form.fileData = e.target.result;
    ui.documents.form.fileName = file.name;
    ui.documents.form.fileType = file.type || '';
    ui.documents.form.fileSizeKB = Math.round(file.size/1024);
    render();
  };
  reader.onerror = function(){ ui.documents.error = 'Không đọc được file. Vui lòng thử lại.'; render(); };
  reader.readAsDataURL(file);
}
function removeDocumentFile(){
  ui.documents.form.fileData=''; ui.documents.form.fileName=''; ui.documents.form.fileType=''; ui.documents.form.fileSizeKB=0;
  render();
}
function docFileIcon(fileName){
  var ext = (fileName||'').split('.').pop().toLowerCase();
  if(ext==='xls'||ext==='xlsx'||ext==='csv') return 'fileSpreadsheet';
  return 'fileText';
}

var PHOTO_MAX_BYTES = 6*1024*1024; // giới hạn file gốc trước khi nén
function handlePhotoFileSelect(fileList){
  var file = fileList && fileList[0];
  if(!file) return;
  ui.photos.error = '';
  if(!/^image\//.test(file.type)){ ui.photos.error='Vui lòng chọn file hình ảnh (jpg, png...).'; render(); return; }
  if(file.size > PHOTO_MAX_BYTES){ ui.photos.error='Ảnh quá lớn ('+(Math.round(file.size/1024/1024*10)/10)+'MB). Vui lòng chọn ảnh dưới 6MB.'; render(); return; }
  ui.photos.busy = true;
  render();
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxW = 1100;
      var scale = img.width>maxW? maxW/img.width : 1;
      var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      var canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      ui.photos.form.data = dataUrl;
      ui.photos.busy = false;
      render();
    };
    img.onerror = function(){ ui.photos.error='Không đọc được ảnh. Vui lòng thử ảnh khác.'; ui.photos.busy=false; render(); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ ui.photos.error='Không đọc được file.'; ui.photos.busy=false; render(); };
  reader.readAsDataURL(file);
}
function removePhotoFormImage(){ ui.photos.form.data=''; render(); }

  var f = ui.photos.form;

/* ---------------------------- 1) Tuần học: lưu / mở khóa sửa lại ---------------------------- */
function weekIsSaved(w){ return state.savedWeeks.indexOf(w)!==-1; }
function getWeekMeta(w){ return (state.weekMeta && state.weekMeta[w]) || {}; }
function saveWeek(label){
  if(!requireAdmin('Lưu tuần học')) return;
  var w = (typeof label==='string' && label)? label : state.currentWeek;
  if(!state.weekMeta) state.weekMeta = {};
  var prev = state.weekMeta[w] || {};
  var now = new Date().toLocaleString('vi-VN');
  var reSave = !!prev.savedAt;
  if(!weekIsSaved(w)) state.savedWeeks = state.savedWeeks.concat([w]);
  state.weekMeta[w] = { savedAt: prev.savedAt || now, lastSavedAt: now, saveCount: (prev.saveCount||0)+1 };
  ui.scoring.directInputs = null;
  persist();
  notify(reSave? ('Đã lưu lại '+w+' sau khi chỉnh sửa.') : ('Đã lưu '+w+'. Khi cần chỉnh, bấm “Sửa lại tuần này”.'));
}
function unlockWeek(label){
  if(!requireAdmin('Mở khóa tuần đã lưu để sửa lại')) return;
  var w = (typeof label==='string' && label)? label : state.currentWeek;
  if(!weekIsSaved(w)) return;
  if(!confirm('Mở khóa "'+w+'" để sửa lại?\n\nSửa xong hãy bấm “Lưu tuần học” để lưu lại. Nếu muốn bỏ các thay đổi, bấm “Hoàn tác sửa”.')) return;
  if(!state.weekMeta) state.weekMeta = {};
  var m = Object.assign({}, state.weekMeta[w] || {});
  m.unlockedAt = new Date().toLocaleString('vi-VN');
  m.backup = JSON.stringify(state.logs[w] || {});
  state.weekMeta[w] = m;
  state.savedWeeks = state.savedWeeks.filter(function(x){ return x!==w; });
  ui.scoring.directInputs = null;
  persist();
  notify('Đã mở khóa '+w+'. Sửa xong nhớ bấm “Lưu tuần học”.');
}
function cancelWeekEdit(label){
  if(!requireAdmin('Hoàn tác sửa tuần học')) return;
  var w = (typeof label==='string' && label)? label : state.currentWeek;
  var m = getWeekMeta(w);
  if(typeof m.backup!=='string') return;
  if(!confirm('Bỏ mọi thay đổi vừa sửa của "'+w+'" và khôi phục lại bản đã lưu trước đó?')) return;
  try{ state.logs[w] = JSON.parse(m.backup); }catch(e){}
  if(!weekIsSaved(w)) state.savedWeeks = state.savedWeeks.concat([w]);
  var m2 = Object.assign({}, m); delete m2.backup; delete m2.unlockedAt;
  state.weekMeta[w] = m2;
  ui.scoring.directInputs = null;
  persist();
  notify('Đã khôi phục '+w+' về bản đã lưu.');
}
function denyLockedWeek(action){
  if(isAdminNow()){ notify('Tuần này đang khóa — bấm “Sửa lại tuần này” để mở khóa trước khi sửa.'); return; }
  deny(action+' (tuần đã lưu, cần Admin mở khóa)');
}
function toggleWeekLock(idx){
  var w = state.weeks[idx];
  if(w===undefined) return;
  if(weekIsSaved(w)) unlockWeek(w); else saveWeek(w);
}

  var w = state.currentWeek, saved = weekIsSaved(w), m = getWeekMeta(w), admin = isAdminNow();
  var base = 'align-items:center;font-size:12px;padding:8px 12px;border-radius:9px;';

        + (m.lastSavedAt? (' lúc '+esc(m.lastSavedAt)+((m.saveCount||0)>1? ' (lần lưu thứ '+m.saveCount+')' : '')) : '')

      + (admin? '<button class="btn btn-outline" style="font-size:12px;padding:5px 10px;" onclick="unlockWeek()">'+icon('unlock',13)+' Sửa lại tuần này</button>' : '')

/* ---------------------------- 2) Năm học: lưu trữ đầy đủ & mở lại để sửa ---------------------------- */
var YEAR_FIELDS = ['students','classes','logs','savedWeeks','rldv','weeks','activityPlans','weekMeta','currentWeek','pillarMaxScores'];
function cloneData(o){ return o===undefined? undefined : JSON.parse(JSON.stringify(o)); }
function latestYear(){ return state.latestYear || state.schoolYear; }
function viewingOldYear(){ return !!state.latestYear && state.schoolYear!==state.latestYear; }
function snapshotYear(){
  var snap = {};
  YEAR_FIELDS.forEach(function(k){ if(state[k]!==undefined) snap[k] = cloneData(state[k]); });
  snap.archivedAt = new Date().toISOString();
  snap.studentCount = (state.students||[]).length;
  snap.classCount = (state.classes||[]).length;
  return snap;
}
function loadYearSnapshot(snap){
  YEAR_FIELDS.forEach(function(k){ if(snap[k]!==undefined && snap[k]!==null) state[k] = cloneData(snap[k]); });
  if(!snap.weekMeta) state.weekMeta = {};
  if(!state.students) state.students = [];
  if(!state.logs) state.logs = {};
  if(!state.savedWeeks) state.savedWeeks = [];
  if(!state.rldv) state.rldv = {};
  if(!state.activityPlans) state.activityPlans = [];
  if(!state.weeks || !state.weeks.length) state.weeks = buildDefaultWeeks();
  if(!snap.currentWeek || state.weeks.indexOf(state.currentWeek)===-1) state.currentWeek = state.weeks[0];
}
function switchToYear(target){
  if(!requireAdmin('Mở lại dữ liệu năm học cũ để sửa')) return;
  var cur = state.schoolYear;
  if(!target || target===cur) return;
  var snap = state.yearArchives[target];
  if(!snap){ alert('Không tìm thấy dữ liệu năm học '+target+'.'); return; }
  var latest = latestYear();
  var leaving = snapshotYear();
  if(cur!==latest){
    var om = state.openArchiveMeta || {};
    leaving.archivedAt = om.archivedAt || leaving.archivedAt;
    leaving.editedAt = new Date().toISOString();
  }
  state.yearArchives[cur] = leaving;
  delete state.yearArchives[target];
  loadYearSnapshot(snap);
  state.schoolYear = target;
  state.latestYear = latest;
  if(target!==latest) state.openArchiveMeta = { archivedAt: snap.archivedAt || '' };
  else delete state.openArchiveMeta;
  ui.scoring.selectedClass = null; ui.scoring.directInputs = null;
  ui.directory.classFilter = 'Tất cả'; ui.directory.page = 1;
  session.archivedYearView = null;
  persist();
  notify(target===latest? ('Đã quay lại năm học hiện hành '+target+'.') : ('Đang mở năm học '+target+' để xem/sửa.'));
}
function confirmOpenYear(year){
  if(year===latestYear()){ switchToYear(year); return; }
  if(!confirm('Mở năm học '+year+' để xem/sửa lại?\n\nDữ liệu năm học '+state.schoolYear+' đang dùng sẽ được cất an toàn trong Lịch sử năm học, và bạn có thể quay lại bất cứ lúc nào.\n\nLưu ý: nếu đang bật lưu trữ online, các thiết bị khác cũng sẽ thấy dữ liệu năm '+year+' cho tới khi bạn quay lại.')) return;
  switchToYear(year);
}
function returnToLatestYear(){ switchToYear(latestYear()); }
function yearBannerHTML(){
  if(!viewingOldYear()) return '';
  return '<div class="row-between" style="align-items:center;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:14px;">'
    + '<span style="display:flex;align-items:center;gap:7px;">'+icon('history',15)+' Đang xem/sửa dữ liệu <strong>năm học '+esc(state.schoolYear)+'</strong> (đã lưu trữ). Mọi thay đổi chỉ áp dụng cho năm học này.</span>'
    + (isAdminNow()? '<button class="btn btn-primary" style="font-size:12px;padding:6px 10px;" onclick="returnToLatestYear()">'+icon('refresh',13)+' Quay lại năm học '+esc(latestYear())+'</button>' : '')
  + '</div>';
}
function updateArchivedGvcn(year, idx, value){
  if(!requireAdmin('Sửa GVCN trong năm học đã lưu trữ')) return;

  if(!a || !a.classes || !a.classes[idx]) return;

function downloadYearBackup(year){
  if(!requireAdmin('Tải bản sao lưu năm học')) return;

  var blob = new Blob([JSON.stringify({ schoolYear:year, archive:a }, null, 1)], { type:'application/json' });
  downloadBlob('SaoLuu_NamHoc_'+year+'.json', blob);

function submitNewYear(){
  if(!requireAdmin('Chuyển sang năm học mới')) return;
  if(viewingOldYear()){ alert('Bạn đang mở dữ liệu năm học cũ. Hãy quay lại năm học hiện hành trước khi chuyển năm học mới.'); return; }
  var f = ui.dashboard.newYearForm;
  var oldYear = state.schoolYear;
  var newYear = nextSchoolYear(oldYear);
  state.yearArchives[oldYear] = snapshotYear();   // bản sao độc lập (deep copy), không bị ảnh hưởng khi sửa năm mới
  state.logs = {};
  state.savedWeeks = [];
  state.weekMeta = {};
  state.rldv = {};
  state.weeks = buildDefaultWeeks(37, parseInt(newYear,10));
  state.currentWeek = state.weeks[0];
  state.activityPlans = [];
  if(f.clearStudents) state.students = [];
  if(f.clearPhotos) state.photos = [];
  state.schoolYear = newYear;
  state.latestYear = newYear;
  delete state.openArchiveMeta;
  ui.scoring.selectedClass = null; ui.scoring.directInputs = null;
  persist();
  ui.dashboard.newYearOpen = false;
  notify('Đã lưu trữ năm học '+oldYear+' và bắt đầu năm học '+newYear+'.'+(f.clearStudents? ' Vào mục Đội viên để tải file Excel danh sách mới.' : ''));
}

    + '<div class="stack" style="gap:7px;margin-top:10px;">'+rows+'</div>'
  + '</div>'
  + (session.archivedYearView? ArchivedYearDetailModalHTML(session.archivedYearView) : '');

function computeArchivedFinalRanking(archive){
  if(!archive.savedWeeks || !archive.savedWeeks.length) return { week:null, ranking:[] };
  var lastWeek = archive.savedWeeks[archive.savedWeeks.length-1];
  var savedLogs = state.logs, savedClasses = state.classes, savedMax = state.pillarMaxScores;
  var ranking = [];
  try{
    state.logs = archive.logs || {};
    state.classes = archive.classes || [];
    if(archive.pillarMaxScores) state.pillarMaxScores = archive.pillarMaxScores;
    ranking = computeClassScores(lastWeek);
  } finally {
    state.logs = savedLogs; state.classes = savedClasses; state.pillarMaxScores = savedMax;
  }
  return { week:lastWeek, ranking:ranking };
}

  var weeksHtml = (a.savedWeeks||[]).map(function(w){ return '<span class="badge" style="'+badgeStyle('slate')+'">'+esc(w)+'</span>'; }).join(' ');

  return '<div class="modal-overlay" onclick="if(event.target===this) closeArchivedYearView();">'

/* ---------------------------- 3) Excel (.xlsx): đọc & ghi không cần thư viện ngoài ---------------------------- */
function xlU16(b,o){ return b[o] | (b[o+1]<<8); }
function xlU32(b,o){ return (b[o] | (b[o+1]<<8) | (b[o+2]<<16) | (b[o+3]<<24)) >>> 0; }
async function xlInflate(data){
  if(typeof DecompressionStream==='undefined') throw new Error('NO_DECOMPRESS');
  var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function xlUnzip(buf){
  var b = new Uint8Array(buf), i = b.length-22;
  while(i>=0 && xlU32(b,i)!==0x06054b50) i--;
  if(i<0) throw new Error('NOT_ZIP');
  var count = xlU16(b,i+10), p = xlU32(b,i+16), entries = {};
  for(var n=0;n<count;n++){
    if(xlU32(b,p)!==0x02014b50) break;
    var nlen = xlU16(b,p+28), elen = xlU16(b,p+30), clen = xlU16(b,p+32);
    var name = new TextDecoder('utf-8').decode(b.subarray(p+46,p+46+nlen));
    entries[name] = { method: xlU16(b,p+10), csize: xlU32(b,p+20), lho: xlU32(b,p+42) };
    p += 46+nlen+elen+clen;
  }
  return { b:b, entries:entries };
}
async function xlReadText(zip, name){
  var e = zip.entries[name];
  if(!e) return null;
  var b = zip.b, start = e.lho+30+xlU16(b,e.lho+26)+xlU16(b,e.lho+28);
  var raw = b.subarray(start, start+e.csize);
  var data = e.method===0? raw : await xlInflate(raw);
  return new TextDecoder('utf-8').decode(data);
}
function xlParseXml(text){
  var doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('BAD_XML');
  return doc;
}
function xlNodeText(node){
  var out = '';
  for(var c=node.firstChild;c;c=c.nextSibling){
    if(c.nodeType!==1) continue;
    if(c.localName==='t') out += c.textContent;
    else if(c.localName==='r') out += xlNodeText(c);
  }
  return out;
}
function xlColIndex(ref){
  var m = /^([A-Za-z]+)/.exec(ref||'');
  if(!m) return 0;
  var s = m[1].toUpperCase(), n = 0;
  for(var i=0;i<s.length;i++) n = n*26 + (s.charCodeAt(i)-64);
  return n-1;
}
function xlParseSheet(doc, shared){
  var rowsOut = [], rowEls = doc.getElementsByTagName('row');
  for(var r=0;r<rowEls.length;r++){
    var rEl = rowEls[r], ri = parseInt(rEl.getAttribute('r'),10);
    ri = isNaN(ri)? rowsOut.length : ri-1;
    var cells = rEl.getElementsByTagName('c'), arr = [], seq = 0;
    for(var c=0;c<cells.length;c++){
      var cEl = cells[c], ref = cEl.getAttribute('r'), ci = ref? xlColIndex(ref) : seq;
      seq = ci+1;
      var t = cEl.getAttribute('t'), val = '', vEl = null, isEl = null;
      for(var k=cEl.firstChild;k;k=k.nextSibling){
        if(k.nodeType!==1) continue;
        if(k.localName==='v') vEl = k;
        else if(k.localName==='is') isEl = k;
      }
      if(t==='inlineStr'){ val = isEl? xlNodeText(isEl) : ''; }
      else if(vEl){
        val = vEl.textContent;
        if(t==='s') val = shared[parseInt(val,10)] || '';
        else if(t==='b') val = (val==='1')? 'TRUE' : 'FALSE';
        else if(t!=='str' && t!=='e' && /e/i.test(val) && !isNaN(Number(val))){
          var nn = Number(val);
          val = (Math.floor(nn)===nn && Math.abs(nn)<1e15)? nn.toFixed(0) : String(nn);
        }
      }
      arr[ci] = val;
    }
    for(var f=0;f<arr.length;f++) if(arr[f]===undefined) arr[f] = '';
    rowsOut[ri] = arr;
  }
  for(var q=0;q<rowsOut.length;q++) if(!rowsOut[q]) rowsOut[q] = [];
  return rowsOut;
}
async function readXlsx(buf){
  var zip = xlUnzip(buf);
  var wbText = await xlReadText(zip, 'xl/workbook.xml');
  if(!wbText) throw new Error('NOT_XLSX');
  var wb = xlParseXml(wbText), rels = {}, shared = [], i;
  var relText = await xlReadText(zip, 'xl/_rels/workbook.xml.rels');
  if(relText){
    var rl = xlParseXml(relText).getElementsByTagName('Relationship');
    for(i=0;i<rl.length;i++) rels[rl[i].getAttribute('Id')] = rl[i].getAttribute('Target');
  }
  var ssText = await xlReadText(zip, 'xl/sharedStrings.xml');
  if(ssText){
    var sis = xlParseXml(ssText).getElementsByTagName('si');
    for(i=0;i<sis.length;i++) shared.push(xlNodeText(sis[i]));
  }
  var sheetEls = wb.getElementsByTagName('sheet'), sheets = [];
  for(var s=0;s<sheetEls.length;s++){
    var el = sheetEls[s];
    var rid = el.getAttribute('r:id') || el.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    var target = rels[rid] || ('worksheets/sheet'+(s+1)+'.xml');
    target = target.replace(/^\//,'');
    if(target.indexOf('xl/')!==0) target = 'xl/'+target;
    var xml = await xlReadText(zip, target);
    if(!xml) continue;
    sheets.push({ name: el.getAttribute('name') || ('Sheet'+(s+1)), rows: xlParseSheet(xlParseXml(xml), shared) });
  }
  return sheets;
}

var XL_CRC = null;
function xlCrc32(bytes){
  if(!XL_CRC){
    XL_CRC = [];
    for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = (c&1)? (0xEDB88320 ^ (c>>>1)) : (c>>>1); XL_CRC[n] = c>>>0; }
  }
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) crc = XL_CRC[(crc ^ bytes[i]) & 0xFF] ^ (crc>>>8);
  return (crc ^ 0xFFFFFFFF)>>>0;
}
function xlZip(files){
  var enc = new TextEncoder(), chunks = [], central = [], offset = 0;
  function w16(a,v){ a.push(v&255, (v>>8)&255); }
  function w32(a,v){ a.push(v&255, (v>>>8)&255, (v>>>16)&255, (v>>>24)&255); }
  files.forEach(function(f){
    var nameB = enc.encode(f.name), data = enc.encode(f.text), crc = xlCrc32(data);
    var lh = [];
    w32(lh,0x04034b50); w16(lh,20); w16(lh,0x0800); w16(lh,0); w16(lh,0); w16(lh,0x21);
    w32(lh,crc); w32(lh,data.length); w32(lh,data.length); w16(lh,nameB.length); w16(lh,0);
    chunks.push(new Uint8Array(lh), nameB, data);
    var ch = [];
    w32(ch,0x02014b50); w16(ch,20); w16(ch,20); w16(ch,0x0800); w16(ch,0); w16(ch,0); w16(ch,0x21);
    w32(ch,crc); w32(ch,data.length); w32(ch,data.length); w16(ch,nameB.length); w16(ch,0); w16(ch,0);
    w16(ch,0); w16(ch,0); w32(ch,0); w32(ch,offset);
    central.push(new Uint8Array(ch), nameB);
    offset += lh.length + nameB.length + data.length;
  });
  var cdSize = 0;
  central.forEach(function(c){ cdSize += c.length; });
  var end = [];
  w32(end,0x06054b50); w16(end,0); w16(end,0); w16(end,files.length); w16(end,files.length); w32(end,cdSize); w32(end,offset); w16(end,0);
  return new Blob(chunks.concat(central, [new Uint8Array(end)]));
}
function xlColName(i){
  var s = ''; i++;
  while(i>0){ var m=(i-1)%26; s = String.fromCharCode(65+m)+s; i = Math.floor((i-1)/26); }
  return s;
}
function xlEsc(v){
  return String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function xlSheetXml(rows, widths){
  var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>';
  if(widths) x += '<cols>'+widths.map(function(w,i){ return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'; }).join('')+'</cols>';
  x += '<sheetData>';
  rows.forEach(function(r, ri){
    x += '<row r="'+(ri+1)+'">';
    r.forEach(function(v, ci){
      if(v===''||v===null||v===undefined) return;
      x += '<c r="'+xlColName(ci)+(ri+1)+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';

}
function buildXlsx(sheets){

  var files = [], ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';

    wbRels += '<Relationship Id="rId'+n+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+n+'.xml"/>';

    { name:'_rels/.rels', text: head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name:'xl/workbook.xml', text: head+'<workbook xmlns="'+NS+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+wbSheets+'</sheets></workbook>' },
    { name:'xl/_rels/workbook.xml.rels', text: head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+wbRels+'</Relationships>' },
    { name:'xl/styles.xml', text: head+'<styleSheet xmlns="'+NS+'"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' }
  );
  var blob = xlZip(files);
  return new Blob([blob], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function downloadBlob(filename, blob){
  var url = URL.createObjectURL(blob);

  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ---- Nhập Excel: đọc, chuẩn hóa, xem trước, áp dụng ---- */
function impNorm(s){
  return String(s===undefined||s===null? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function impP2(n){ n = String(n); return n.length<2? '0'+n : n; }
function impFieldOf(h){
  h = impNorm(h);
  if(!h) return null;
  if(/dinh danh/.test(h)) return null;   // không còn dùng Mã định danh — bỏ qua cột này nếu file cũ còn có
  if(/^(ma doi vien|ma dv|ma hoc sinh|ma hs|ma so|id|ma)$/.test(h)) return 'id';
  if(/giao vien|gvcn|chu nhiem/.test(h)) return 'gvcn';
  if(/^(chi doi|lop|ten chi doi|ten lop)$/.test(h)) return 'lop';
  if(/^(ho va ten|ho ten|hoten|ten|ten hoc sinh|ten doi vien|ten dv|ten hs)( |$)/.test(h)) return 'hoTen';
  if(/^gioi( tinh)?$/.test(h)) return 'gioiTinh';
  if(/^chuc vu/.test(h)) return 'chucVu';
  if(/ngay sinh|ngay thang nam sinh|^sinh$|^ns$/.test(h)) return 'ngaySinh';
  if(/dan toc/.test(h)) return 'danToc';
  if(/^(sdt|so dt|so dien thoai|dien thoai|lien he)/.test(h)) return 'sdt';
  if(/trang thai/.test(h)) return 'trangThai';
  return null;
}
function impFindHeader(rows, forced){
  for(var i=0;i<Math.min(rows.length,25);i++){
    var map = {}, r = rows[i] || [];
    for(var j=0;j<r.length;j++){ var f = impFieldOf(r[j]); if(f && map[f]===undefined) map[f] = j; }
    if(map.hoTen!==undefined && (map.lop!==undefined || forced)) return { row:i, map:map, kind:'students' };
    if(map.lop!==undefined && map.gvcn!==undefined && map.hoTen===undefined) return { row:i, map:map, kind:'gvcn' };
  }
  return null;
}
function impParseSheets(sheets, forced){
  var out = { students:[], gvcnRows:[], sheetsUsed:[] };
  sheets.forEach(function(sh){
    var h = impFindHeader(sh.rows, forced);
    if(!h) return;
    out.sheetsUsed.push(sh.name);
    for(var i=h.row+1;i<sh.rows.length;i++){
      var r = sh.rows[i] || [];
      var g = function(f){ var j = h.map[f]; return (j===undefined || r[j]===undefined || r[j]===null)? '' : String(r[j]).trim(); };
      if(h.kind==='students'){
        var name = g('hoTen');
        if(!name) continue;
        /* Bỏ qua dòng "Tổng cộng" cuối bảng — nhưng KHÔNG bỏ nhầm Đội viên họ Tống (dòng thật luôn có thêm Chi đội/Ngày sinh/Mã định danh/Giới tính) */
        if(/^tong( |$)/.test(impNorm(name)) && !g('lop') && !g('ngaySinh') && !g('maDinhDanh') && !g('gioiTinh')) continue;
        out.students.push({ rowNo:i+1, id:g('id'), maDinhDanh:g('maDinhDanh'), hoTen:name, lop:g('lop'), gioiTinh:g('gioiTinh'), chucVu:g('chucVu'), ngaySinh:g('ngaySinh'), danToc:g('danToc'), sdt:g('sdt'), trangThai:g('trangThai'), gvcn:g('gvcn') });
      } else {
        var lop = g('lop'), gv = g('gvcn');
        if(lop || gv) out.gvcnRows.push({ rowNo:i+1, lop:lop, gvcn:gv });
      }
    }
  });
  return out;
}
function impNormClass(v, forced){
  if(forced) return forced;
  var s = String(v||'').trim().replace(/^(chi\s*đội|chi\s*doi|lớp|lop)\s*/i,'');
  if(!s) return '';
  var m = s.match(/^(\d{1,2})\s*[\/\.\-]\s*(\d{1,2})$/);
  if(m) return parseInt(m[1],10)+'/'+parseInt(m[2],10);
  return s.toUpperCase();
}
function impNormGender(v){
  var n = impNorm(v);
  if(/^(nu|n|female|f|girl)$/.test(n)) return 'Nữ';
  if(/^(nam|male|m|boy)$/.test(n)) return 'Nam';
  return '';
}
function impNormRole(v){
  var n = impNorm(v);
  if(!n) return '';
  if(/truong/.test(n)) return 'Chi đội trưởng';
  if(/pho/.test(n)) return 'Chi đội phó';
  return 'Đội viên';
}
function impNormDate(v){
  v = String(v||'').trim();
  if(!v) return '';
  if(/^\d{5}(\.\d+)?$/.test(v)){
    var n = Math.floor(Number(v));
    if(n>=10000 && n<=80000){
      var d = new Date(Date.UTC(1899,11,30) + n*86400000);
      return impP2(d.getUTCDate())+'/'+impP2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear();
    }
  }
  var m = v.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if(m) return impP2(m[1])+'/'+impP2(m[2])+'/'+m[3];
  m = v.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if(m) return impP2(m[3])+'/'+impP2(m[2])+'/'+m[1];
  return v;
}
function impNormPhone(v){
  var d = String(v||'').replace(/[^\d]/g,'');
  if(d.length===9 && d.charAt(0)!=='0') d = '0'+d;
  return d;
}
function impClassCmp(a, b){
  var ma = /^(\d+)\/(\d+)$/.exec(a.code), mb = /^(\d+)\/(\d+)$/.exec(b.code);
  if(ma && mb) return (ma[1]-mb[1]) || (ma[2]-mb[2]);
  if(ma) return -1;
  if(mb) return 1;
  return a.code < b.code? -1 : (a.code > b.code? 1 : 0);
}
function impComputePlan(raw, opts){
  var plan = { totalIn: raw.students.length, added:0, updated:0, unchanged:0, removed:0, skipped:0, dupes:0, newClasses:[], gvcnChanges:[], warnings:[], finalStudents:null, finalClasses:null };
  var classes = state.classes.map(function(c){ return Object.assign({}, c); });
  var codeSet = {};
  classes.forEach(function(c){ codeSet[c.code] = true; });
  function ensureClass(code){
    if(codeSet[code]) return true;
    if(!opts.autoCreate) return false;
    classes.push({ code:code, khoi:(code.split('/')[0]||'').replace(/\D/g,''), gvcn:'', anhGvcn:'' });
    codeSet[code] = true;
    plan.newClasses.push(code);
    return true;
  }
  var old = state.students, byId = {}, byMa = {}, byNameDob = {}, byNameLop = {}, used = {}, takenIds = {}, mx = 0;
  old.forEach(function(s){
    takenIds[s.id] = true;
    var mm = /^DV(\d+)$/.exec(s.id||''); if(mm) mx = Math.max(mx, parseInt(mm[1],10));
    byId[s.id] = s;
    if(s.maDinhDanh) byMa[s.maDinhDanh] = s;
    var nk = impNorm(s.hoTen);
    if(s.ngaySinh) byNameDob[nk+'|'+s.ngaySinh] = byNameDob[nk+'|'+s.ngaySinh] || s;
    byNameLop[nk+'|'+s.lop] = byNameLop[nk+'|'+s.lop] || s;
  });
  function newId(){ var id; do{ mx++; id = 'DV'+String(mx).padStart(4,'0'); } while(takenIds[id]); takenIds[id] = true; return id; }
  var seen = {}, updatedById = {}, newOnes = [], resultOrdered = [], unknown = {}, noClass = 0, noGender = 0;
  raw.students.forEach(function(r){
    var lop = impNormClass(r.lop, opts.forceClass);
    if(!lop){ plan.skipped++; noClass++; return; }
    if(!ensureClass(lop)){ plan.skipped++; unknown[lop] = (unknown[lop]||0)+1; return; }
    var rec = { hoTen: r.hoTen.replace(/\s+/g,' '), lop:lop, gioiTinh:impNormGender(r.gioiTinh), chucVu:impNormRole(r.chucVu),
                ngaySinh:impNormDate(r.ngaySinh), maDinhDanh:String(r.maDinhDanh||'').replace(/\s+/g,''), danToc:r.danToc, sdt:impNormPhone(r.sdt), trangThai:r.trangThai };
    var nk = impNorm(rec.hoTen);
    var fk = rec.maDinhDanh? ('m'+rec.maDinhDanh) : ('n'+nk+'|'+rec.ngaySinh+'|'+lop);
    if(seen[fk]){ plan.dupes++; return; }
    seen[fk] = true;
    var m = null;
    if(r.id && byId[r.id] && !used[r.id]) m = byId[r.id];
    if(!m && rec.maDinhDanh && byMa[rec.maDinhDanh] && !used[byMa[rec.maDinhDanh].id]) m = byMa[rec.maDinhDanh];
    if(!m && rec.ngaySinh){ var c1 = byNameDob[nk+'|'+rec.ngaySinh]; if(c1 && !used[c1.id]) m = c1; }
    if(!m && !rec.ngaySinh){ var c2 = byNameLop[nk+'|'+lop]; if(c2 && !used[c2.id]) m = c2; }
    if(m){
      used[m.id] = true;
      var upd = Object.assign({}, m), changed = false;
      ['hoTen','lop','gioiTinh','chucVu','ngaySinh','maDinhDanh','danToc','sdt','trangThai'].forEach(function(f){
        if(rec[f]!=='' && rec[f]!==undefined && upd[f]!==rec[f]){ upd[f] = rec[f]; changed = true; }
      });
      if(changed) plan.updated++; else plan.unchanged++;
      updatedById[m.id] = upd;
      resultOrdered.push(upd);
    } else {
      if(!rec.gioiTinh) noGender++;
      var ns = { id:newId(), hoTen:rec.hoTen, gioiTinh:rec.gioiTinh||'Nam', lop:lop, chucVu:rec.chucVu||'Đội viên', ngaySinh:rec.ngaySinh, maDinhDanh:rec.maDinhDanh, danToc:rec.danToc, sdt:rec.sdt, trangThai:rec.trangThai||'Đang học' };
      plan.added++;
      newOnes.push(ns);
      resultOrdered.push(ns);
    }
  });
  var finalStudents;
  if(opts.mode==='replace'){
    finalStudents = resultOrdered;
    plan.removed = old.filter(function(s){ return !used[s.id]; }).length;
  } else {
    finalStudents = old.map(function(s){ return updatedById[s.id] || s; }).concat(newOnes);
  }
  if(raw.students.length){
    var idx = {}; classes.sort(impClassCmp).forEach(function(c,i){ idx[c.code] = i; });
    finalStudents = finalStudents.map(function(s,i){ return { s:s, i:i }; })
      .sort(function(a,b){ return ((idx[a.s.lop]===undefined?9999:idx[a.s.lop]) - (idx[b.s.lop]===undefined?9999:idx[b.s.lop])) || (a.i-b.i); })
      .map(function(o){ return o.s; });
  }
  /* GVCN phụ trách Chi đội */
  var gv = {};
  raw.gvcnRows.forEach(function(r){
    var code = impNormClass(r.lop, '');
    if(!code || !r.gvcn) return;
    gv[code] = r.gvcn.replace(/\s+/g,' ');
  });
  raw.students.forEach(function(r){
    if(!r.gvcn) return;
    var code = impNormClass(r.lop, opts.forceClass);
    if(code && gv[code]===undefined) gv[code] = r.gvcn.replace(/\s+/g,' ');
  });
  plan.gvcnFound = Object.keys(gv).length;
  if(opts.updateGvcn){
    Object.keys(gv).forEach(function(code){
      if(!ensureClass(code)){ plan.warnings.push('GVCN: Chi đội "'+code+'" chưa tồn tại nên bỏ qua (bật “Tự tạo Chi đội mới” nếu muốn thêm).'); return; }
      var c = classes.filter(function(x){ return x.code===code; })[0];
      if((c.gvcn||'')!==gv[code]){
        plan.gvcnChanges.push({ code:code, from:c.gvcn||'', to:gv[code] });
        if(c.gvcn) c.anhGvcn = '';
        c.gvcn = gv[code];
      }
    });
  }
  classes.sort(impClassCmp);
  plan.finalStudents = finalStudents;
  plan.finalClasses = classes;
  if(noClass) plan.warnings.push(noClass+' dòng thiếu Chi đội nên bị bỏ qua.');
  Object.keys(unknown).forEach(function(k){ plan.warnings.push('Chi đội "'+k+'" chưa tồn tại — bỏ qua '+unknown[k]+' dòng (bật “Tự tạo Chi đội mới” để nhập).'); });
  if(plan.dupes) plan.warnings.push(plan.dupes+' dòng trùng lặp trong file (cùng Họ tên + Ngày sinh + Chi đội) — chỉ lấy dòng đầu tiên.');
  if(noGender) plan.warnings.push(noGender+' Đội viên mới thiếu/sai Giới tính — tạm đặt là Nam, hãy kiểm tra lại.');
  return plan;
}
function impParseCsv(text){
  text = text.replace(/^\ufeff/,'');
  var first = text.split(/\r?\n/)[0] || '';
  var nComma = first.split(',').length, nSemi = first.split(';').length, nTab = first.split('\t').length;
  var delim = (nSemi>nComma && nSemi>=nTab)? ';' : ((nTab>nComma)? '\t' : ',');
  var rows = [], row = [], cur = '', q = false;
  for(var i=0;i<text.length;i++){
    var c = text.charAt(i);
    if(q){
      if(c==='"'){ if(text.charAt(i+1)==='"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }
    else if(c==='"') q = true;
    else if(c===delim){ row.push(cur); cur = ''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text.charAt(i+1)==='\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function startExcelImport(fileList, forceClass){
  if(!requireAdmin('Nhập Đội viên / GVCN từ file Excel')) return;
  var file = fileList && fileList[0];
  if(!file) return;
  var name = file.name || '';
  function open(sheets){
    var raw = impParseSheets(sheets, forceClass||'');
    if(!raw.students.length && !raw.gvcnRows.length){
      alert('Không tìm thấy dữ liệu hợp lệ trong file.\n\nFile cần có dòng tiêu đề với cột "Họ và tên" và "Chi đội" (danh sách Đội viên), hoặc cột "Chi đội" và "Giáo viên chủ nhiệm" (GVCN). Bạn có thể bấm “Tải file Excel mẫu”.');
      return;
    }
    var opts = { mode:'merge', autoCreate:true, updateGvcn:!forceClass, forceClass:forceClass||'' };
    ui.directory.importModal = { fileName:name, raw:raw, opts:opts, plan:impComputePlan(raw, opts) };
    render();
  }
  function fail(err){
    var msg = (err && err.message==='NO_DECOMPRESS')
      ? 'Trình duyệt này chưa hỗ trợ đọc trực tiếp file .xlsx. Hãy dùng Chrome/Edge/Safari bản mới, hoặc lưu file thành .csv (UTF-8) rồi tải lại.'
      : 'Không đọc được file Excel. Hãy kiểm tra file không bị hỏng hoặc đặt mật khẩu, hoặc dùng file mẫu của hệ thống.';
    alert(msg);
  }
  var rd = new FileReader();
  if(/\.xls$/i.test(name)){
    alert('File .xls (Excel đời cũ) chưa được hỗ trợ. Hãy mở file bằng Excel → Save As → chọn “Excel Workbook (.xlsx)” rồi tải lại.');
  } else if(/\.(xlsx|xlsm)$/i.test(name)){
    rd.onload = function(e){ readXlsx(e.target.result).then(open).catch(fail); };
    rd.readAsArrayBuffer(file);
  } else if(/\.json$/i.test(name)){
    rd.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        var header = ['Họ và tên','Chi đội','Giới tính','Chức vụ','Ngày sinh','Dân tộc','SĐT'];
        var rows = [header].concat((Array.isArray(data)? data : []).map(function(o){
          return [o.hoTen||o.name||'', o.lop||o.class||'', o.gioiTinh||o.gender||'', o.chucVu||'', o.ngaySinh||o.dob||'', o.danToc||'', o.sdt||''];
        }));
        open([{ name:'JSON', rows:rows }]);
      }catch(err){ fail(err); }
    };
    rd.readAsText(file, 'UTF-8');
  } else {
    rd.onload = function(e){ try{ open([{ name:'CSV', rows: impParseCsv(String(e.target.result)) }]); }catch(err){ fail(err); } };
    rd.readAsText(file, 'UTF-8');
  }
}

  var m = ui.directory.importModal;

  var m = ui.directory.importModal;

  var parts = [];

  render();
}

function deleteArchivedYear(year){
  if(!requireAdmin('Xóa lịch sử năm học')) return;
  if(!state.yearArchives[year]) return;
  if(year===latestYear() && viewingOldYear()){
    alert('Không thể xóa năm học '+year+' lúc này vì đây là năm học hiện hành đang được cất tạm. Hãy bấm “Quay lại năm học '+year+'” trước.');
    return;
  }
  if(!confirm('XÓA VĨNH VIỄN dữ liệu năm học '+year+'?\n\nToàn bộ Đội viên, GVCN, điểm thi đua, tuần đã lưu của năm học này sẽ bị xóa và KHÔNG thể khôi phục.\n\nGợi ý: bấm “Xem lại” → “Tải bản sao lưu (.json)” để lưu một bản trước khi xóa.\n\nTiếp tục xóa?')) return;
  var typed = prompt('Để xác nhận, hãy gõ lại năm học cần xóa (ví dụ '+year+'):', '');
  if(typed===null) return;
  if(String(typed).trim()!==year){ alert('Năm học nhập vào không khớp — đã hủy, dữ liệu vẫn được giữ nguyên.'); return; }
  delete state.yearArchives[year];
  if(session.archivedYearView===year) session.archivedYearView = null;
  persist();
  notify('Đã xóa lịch sử năm học '+year+'.');
}

/* =======================================================================

   - Xóa dữ liệu TẤT CẢ các năm học để làm mới
   - Sao lưu toàn bộ (.json) / Khôi phục từ file — dùng để lưu trên OneDrive
   ======================================================================= */
function backupFileName(){
  var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
  return 'SaoLuu_LienDoi_XuanTan_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.json';
}
function downloadFullBackup(silent){
  if(!requireAdmin('Sao lưu toàn bộ dữ liệu')) return;
  var pack = { app:'LienDoiXuanTan', version:9, exportedAt:new Date().toISOString(), state:state };
  downloadBlob(backupFileName(), new Blob([JSON.stringify(pack)], { type:'application/json' }));
  if(!silent) notify('Đã tải file sao lưu. Hãy chép file này vào thư mục OneDrive của bạn.');
}
function restoreFullBackup(fileList){
  if(!requireAdmin('Khôi phục dữ liệu từ file sao lưu')) return;
  var file = fileList && fileList[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var incoming = null;
    try{
      var obj = JSON.parse(reader.result);
      incoming = (obj && obj.state)? obj.state : obj;
    }catch(e){}
    if(!incoming || !incoming.classes || !incoming.schoolYear){
      alert('File không đúng định dạng sao lưu của ứng dụng Liên đội (thiếu danh sách Chi đội / năm học). Dữ liệu hiện tại được giữ nguyên.');
      return;
    }
    if(!confirm('KHÔI PHỤC dữ liệu từ file “'+file.name+'”?\n\nToàn bộ dữ liệu hiện tại (kể cả khi đang bật lưu trữ online) sẽ được thay bằng dữ liệu trong file.\nNăm học trong file: '+incoming.schoolYear+'.\n\nTiếp tục?')) return;
    state = incoming;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    pushStateToCloud(true);
    notify('Đã khôi phục dữ liệu. Đang tải lại ứng dụng…');
    setTimeout(function(){ location.reload(); }, 1600);
  };
  reader.readAsText(file, 'utf-8');
}

/* =======================================================================
   BỔ SUNG PHIÊN BẢN V12
   - Tạo hàng loạt tài khoản con: 1 nút cho Sao Đỏ, 1 nút cho GVCN (mỗi Chi đội 1 tài khoản)
   - Tải danh sách tài khoản (.csv) / in danh sách để phát cho giáo viên
   ======================================================================= */
function genAccPassword(){
  var chars = 'abcdefghjkmnpqrstuvwxyz23456789';   // bỏ ký tự dễ nhầm: i l o 0 1
  for(var tries=0; tries<50; tries++){
    var out = '';
    var buf = new Uint32Array(8);
    if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(buf);
    else for(var k=0;k<8;k++) buf[k] = Math.floor(Math.random()*4294967296);
    for(var i=0;i<8;i++) out += chars.charAt(buf[i] % chars.length);
    if(/[a-z]/.test(out) && /[2-9]/.test(out)) return out;
  }
  return 'mk' + Math.floor(100000 + Math.random()*899999);
}
function nextAccountSeq(){
  var max = 0;
  state.accounts.forEach(function(a){
    var m = /^TK(\d+)$/.exec(a.id||''); if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return max;
}
function loaiLabelOf(loai){ return loai==='saodo'? 'Sao Đỏ' : 'GVCN'; }
function bulkCreateAccounts(loai){
  if(!requireAdmin('Tạo hàng loạt tài khoản')) return;
  var label = loaiLabelOf(loai);
  var codes = classCodes();
  var missing = codes.filter(function(c){
    return !state.accounts.some(function(a){ return a.loai===loai && a.assignedClass===c; });
  });
  if(!missing.length){
    alert('Cả '+codes.length+' Chi đội đã có tài khoản '+label+'. Không cần tạo thêm.\n\nBạn có thể bấm “Tải danh sách” để lấy lại danh sách tài khoản.');
    return;
  }
  var existed = codes.length - missing.length;
  if(!confirm('Tạo '+missing.length+' tài khoản '+label+' cho các Chi đội chưa có'+(existed? ' ('+existed+' Chi đội đã có sẵn, được giữ nguyên)' : '')+'?\n\nTên đăng nhập có dạng '+(loai==='saodo'?'saodo':'gvcn')+'.6.1 và mỗi tài khoản được cấp một mật khẩu ngẫu nhiên.')) return;
  var prefix = (loai==='saodo'? 'saodo' : 'gvcn');
  var seq = nextAccountSeq();
  var today = new Date().toLocaleDateString('vi-VN');
  var created = [];
  missing.forEach(function(c){
    var base = prefix+'.'+c.replace('/','.');
    var uname = base, n = 1;
    while(state.accounts.some(function(a){ return a.username===uname; }) || created.some(function(a){ return a.username===uname; })){
      n++; uname = base+'.'+n;
    }
    seq++;
    created.push({ id:'TK'+String(seq).padStart(3,'0'), username:uname, password:genAccPassword(), assignedClass:c, loai:loai, createdAt:today });
  });
  state.accounts = state.accounts.concat(created);
  persist();
  ui.accounts.bulkResult = { loai:loai, label:label, created:created, existed:existed };
  notify('Đã tạo '+created.length+' tài khoản '+label+'.');
}
function accountsOfLoai(loai){
  var order = classCodes();
  return state.accounts.filter(function(a){ return a.loai===loai; }).sort(function(a,b){
    return order.indexOf(a.assignedClass) - order.indexOf(b.assignedClass);
  });
}
function gvcnNameOfClass(code){
  var c = state.classes.filter(function(x){ return x.code===code; })[0];
  return c? (c.gvcn||'') : '';
}
function exportAccountsCsv(loai){
  if(!requireAdmin('Tải danh sách tài khoản')) return;
  var list = accountsOfLoai(loai);
  if(!list.length){ alert('Chưa có tài khoản '+loaiLabelOf(loai)+' nào để tải.'); return; }
  function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  var rows = [['STT','Chi đội','GVCN','Loại tài khoản','Tên đăng nhập','Mật khẩu']];
  list.forEach(function(a,i){ rows.push([i+1, a.assignedClass, gvcnNameOfClass(a.assignedClass), loaiLabelOf(a.loai), a.username, a.password]); });
  var csv = '\uFEFF' + rows.map(function(r){ return r.map(q).join(','); }).join('\r\n');
  downloadBlob('DanhSach_TaiKhoan_'+(loai==='saodo'?'SaoDo':'GVCN')+'_XuanTan.csv', new Blob([csv], { type:'text/csv;charset=utf-8' }));
  notify('Đã tải danh sách '+list.length+' tài khoản '+loaiLabelOf(loai)+'. Hãy cất file ở nơi riêng tư vì có chứa mật khẩu.');
}

  if(!requireAdmin('In danh sách tài khoản')) return;
  var list = accountsOfLoai(loai);
  var body = '<h1>Danh sách tài khoản '+loaiLabelOf(loai)+' — THCS Xuân Tân</h1><h2>Năm học '+esc(state.schoolYear)+' · '+list.length+' tài khoản</h2>'

    + list.map(function(a,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(a.assignedClass)+'</td><td>'+esc(gvcnNameOfClass(a.assignedClass))+'</td><td>'+esc(a.username)+'</td><td style="font-family:Consolas,monospace;">'+esc(a.password)+'</td></tr>'; }).join('')
