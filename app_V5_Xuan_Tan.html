<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HỆ THỐNG QUẢN LÝ LIÊN ĐỘI TRƯỜNG THCS XUÂN TÂN</title>
<style>
:root{
  --navy:#0f172a; --navy-2:#1e293b; --emerald:#059669; --emerald-2:#10b981; --emerald-light:#ecfdf5;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1; --slate-400:#94a3b8;
  --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --slate-900:#0f172a;
  --red:#dc2626; --red-light:#fef2f2; --amber:#d97706; --amber-light:#fffbeb; --blue:#2563eb; --blue-light:#eff6ff;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--slate-50);color:var(--slate-800);}
button,input,select{font-family:inherit;font-size:inherit;}
#root{min-height:100vh;display:flex;flex-direction:column;}
.icon{display:inline-block;vertical-align:-3px;flex-shrink:0;}
.icon-fill{fill:currentColor;}
.stack{display:flex;flex-direction:column;gap:16px;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.row-between{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;}

/* Header */
.app-header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.15);position:sticky;top:0;z-index:20;}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-badge{width:36px;height:36px;border-radius:10px;background:var(--emerald-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.header-titles h1{font-size:12.5px;font-weight:700;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-titles p{font-size:11px;color:var(--slate-400);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.role-switch{display:flex;background:var(--navy-2);border-radius:8px;padding:3px;gap:3px;}
.role-btn{border:none;background:transparent;color:var(--slate-300);font-size:12px;font-weight:600;padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.role-btn.active-admin{background:var(--emerald-2);color:#fff;}
.role-btn.active-staff{background:var(--blue);color:#fff;}
.header-user{display:none;flex-direction:column;align-items:flex-end;font-size:11px;padding-left:10px;border-left:1px solid var(--slate-700);}
.header-user-name{font-weight:600;}
.header-user-role{color:var(--slate-400);}
@media(min-width:1024px){.header-user{display:flex;} .header-titles h1{font-size:14px;}}
@media(max-width:640px){.role-label{display:none;}}

/* Layout */
.app-body{display:flex;flex:1;min-height:0;}
.sidebar{width:60px;background:#fff;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;padding:14px 0;flex-shrink:0;}
.side-btn{display:flex;align-items:center;gap:10px;background:transparent;border:none;padding:11px 10px;margin:0 6px 4px;border-radius:10px;cursor:pointer;color:var(--slate-500);font-size:13px;font-weight:600;position:relative;width:calc(100% - 12px);text-align:left;}
.side-btn.active{background:var(--emerald-light);color:var(--emerald);}
.side-label{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lock-dot{margin-left:auto;color:var(--amber);display:none;}
.sidebar-footer{margin-top:auto;padding:14px;font-size:10px;color:var(--slate-400);display:none;border-top:1px solid var(--slate-100);}
@media(min-width:768px){.sidebar{width:220px;} .side-label{display:inline;} .lock-dot{display:inline-flex;} .sidebar-footer{display:block;}}
.main-content{flex:1;min-width:0;overflow-y:auto;padding:14px;}
@media(min-width:768px){.main-content{padding:24px;}}

/* Generic */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:15px;}
.page-title{font-size:17px;font-weight:800;color:var(--slate-800);margin:0;}
.page-sub{font-size:13px;color:var(--slate-500);margin:3px 0 0;}
.kpi-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.upload-grid{display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:640px){.upload-grid{grid-template-columns:1fr 1fr;}}
.dash-split{display:grid;gap:14px;grid-template-columns:1fr;}
@media(min-width:1024px){.dash-split{grid-template-columns:2fr 1fr;}}
.score-split{display:grid;gap:14px;grid-template-columns:1fr;align-items:start;}
@media(min-width:1024px){.score-split{grid-template-columns:2fr 3fr;}}
.field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 13px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:#fff;color:var(--slate-700);white-space:nowrap;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-outline{border-color:var(--slate-300);}
.btn-outline:hover{background:var(--slate-50);}
.btn-primary{background:var(--emerald-2);color:#fff;}
.btn-primary:hover{background:var(--emerald);}
.btn-dark{background:var(--slate-800);color:#fff;}
.btn-danger{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-link{background:none;border:none;color:var(--emerald);font-size:12px;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.icon-btn{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:6px;color:var(--slate-500);display:inline-flex;line-height:1;}
.icon-btn:hover{background:var(--slate-100);}
.icon-btn.danger:hover{background:var(--red-light);color:var(--red);}
.icon-btn.blue:hover{background:var(--blue-light);color:var(--blue);}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap;}
.input,.select{width:100%;border:1px solid var(--slate-300);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;color:var(--slate-800);}
.input:disabled,.select:disabled{background:var(--slate-100);color:var(--slate-500);}
.label{font-size:11px;font-weight:600;color:var(--slate-500);display:block;margin-bottom:4px;}
.kpi{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:14px;}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.kpi-val{font-size:21px;font-weight:800;color:var(--slate-800);margin:10px 0 0;}
.kpi-label{font-size:12px;color:var(--slate-500);margin:0;}
.kpi-sub{font-size:10.5px;color:var(--slate-400);margin:1px 0 0;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;color:var(--slate-400);font-weight:600;border-bottom:1px solid var(--slate-100);padding:7px 6px;white-space:nowrap;}
td{padding:7px 6px;border-bottom:1px solid var(--slate-50);}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--slate-50);}
.tbl-wrap{overflow-x:auto;}
.hide-sm{display:none;}
.hide-md{display:none;}
@media(min-width:640px){.hide-sm{display:table-cell;}}
@media(min-width:768px){.hide-md{display:table-cell;}}

.progress-track{height:6px;width:100%;background:var(--slate-200);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;}

.toggle{width:40px;height:24px;border-radius:99px;border:none;position:relative;cursor:pointer;background:var(--slate-300);flex-shrink:0;padding:0;}
.toggle.on{background:var(--emerald-2);}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.toggle.on .knob{transform:translateX(16px);}

.upload-zone{border:2px dashed var(--slate-300);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:#fff;}
.upload-zone:hover{border-color:var(--emerald-2);background:var(--emerald-light);}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal.modal-sm{max-width:380px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--slate-100);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;}
.modal-head strong{display:flex;align-items:center;gap:8px;font-size:14px;}
.modal-body{padding:18px;}

.toast{position:fixed;bottom:18px;right:18px;background:var(--slate-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:60;max-width:88vw;}

.checklist-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;}
.chk-box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--slate-300);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:#fff;padding:0;}
.chk-box.done{background:var(--emerald-2);border-color:var(--emerald-2);color:#fff;}
.done-text{text-decoration:line-through;color:var(--slate-400);}

.sync-log{background:var(--slate-900);border-radius:10px;padding:10px;height:150px;overflow-y:auto;font-family:Consolas,monospace;font-size:11px;color:#6ee7b7;}

.entry-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--slate-50);border-radius:8px;padding:6px 9px;font-size:12px;margin-bottom:5px;}
.pillar-row{margin-bottom:8px;}
.pillar-row .pillar-top{display:flex;justify-content:space-between;font-size:11px;color:var(--slate-500);margin-bottom:3px;}

@media print{
  .no-print{display:none !important;}
  .main-content{padding:0;overflow:visible;}
  body{background:#fff;}
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:4px;}
</style>
</head>

  size = size || 16;

/* ---------------------------- PRNG (dữ liệu mẫu ổn định) ---------------------------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(20260906);
function pick(arr){ return arr[Math.floor(rand()*arr.length)]; }

var DEM_NAM = ["Văn","Hữu","Đức","Minh","Quang","Thành","Gia","Bảo","Anh","Xuân"];
var DEM_NU = ["Thị","Ngọc","Thanh","Kim","Mỹ","Bảo","Gia","Anh","Hồng","Diệu"];
var TEN_NAM = ["Bình","Dũng","Hải","Huy","Khánh","Nam","Quân","Quốc","Sơn","Thắng","Trung","Tuấn","Việt","Hoàng","Phúc","Long","Đạt","Kiên","Vinh","Khoa"];

function genName(){
  var isNam = rand() > 0.5;
  var ho = pick(HO), dem = pick(isNam?DEM_NAM:DEM_NU), ten = pick(isNam?TEN_NAM:TEN_NU);
  return { fullName: ho+" "+dem+" "+ten, gender: isNam? "Nam":"Nữ" };
}

function buildDefaultClasses(){
  // Cấu trúc thật: 6/1-6/6, 7/1-7/8, 8/1-8/6, 9/1-9/8 = 6+8+6+8 = 28 Chi đội
  var plan = [ [6,6], [7,8], [8,6], [9,8] ];
  var list = [];
  plan.forEach(function(p){
    var khoi = p[0], count = p[1];
    for(var i=1;i<=count;i++){
      list.push({ code: khoi+"/"+i, khoi: String(khoi), gvcn: "Cô/Thầy "+genName().fullName });
    }
  });
  return list;
}
function classCodes(){ return state.classes.map(function(c){ return c.code; }); }
function findClass(code){ return state.classes.filter(function(c){ return c.code===code; })[0]; }

function genStudents(){
  var list = []; var idc = 1;
  var classList = state.classes;
  var n = classList.length;
  var base = Math.floor(1200/n), rem = 1200 - base*n;
  classList.forEach(function(cls, ci){
    var count = base + (ci < rem ? 1 : 0);
    var khoiNum = Number(cls.khoi) || 6;
    for(var i=0;i<count;i++){
      var g = genName();
      var roll = rand();
      var chucVu = roll>0.97? "Chi đội trưởng" : roll>0.93? "Chi đội phó" : "Đội viên";
      list.push({
        id: "DV"+String(idc).padStart(4,"0"),
        hoTen: g.fullName, gioiTinh: g.gender, lop: cls.code, chucVu: chucVu,
        ngaySinh: String(1+Math.floor(rand()*28)).padStart(2,"0")+"/"+String(1+Math.floor(rand()*12)).padStart(2,"0")+"/"+(2016-(khoiNum-6))
      });
      idc++;
    }
  });
  return list;
}

function buildDefaultWeeks(count){
  count = count || 37;
  var weeks = [];
  var start = new Date(2026, 8, 7); // Thứ Hai 07/09/2026 — tuần 1
  function fmt(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); }
  for(var i=1;i<=count;i++){
    var end = new Date(start);
    end.setDate(start.getDate()+4);
    weeks.push("Tuần "+i+" ("+fmt(start)+" - "+fmt(end)+")");
    start = new Date(start);
    start.setDate(start.getDate()+7);
  }
  return weeks;
}

/* ---------------------------- Tính điểm ---------------------------- */
function computeClassScores(week){
  var weekLogs = state.logs[week] || {};
  var maxTotal = PILLARS.reduce(function(s,p){ return s + (Number(state.pillarMaxScores[p])||0); }, 0);
  var rows = state.classes.map(function(c){
    var entries = weekLogs[c.code] || [];
    var pillarScores = {};
    PILLARS.forEach(function(p){
      var max = Number(state.pillarMaxScores[p])||0;
      var delta = entries.filter(function(e){ return e.pillar===p; }).reduce(function(s,e){ return s+e.points; }, 0);
      pillarScores[p] = Math.max(0, Math.min(max, max+delta));
    });
    var total = PILLARS.reduce(function(s,p){ return s+pillarScores[p]; }, 0);
    var percent = maxTotal>0? (total/maxTotal*100) : 0;
    var cls = classification(percent);
    return Object.assign({}, c, { pillarScores:pillarScores, total:total, maxTotal:maxTotal, entriesCount:entries.length, label:cls.label, color:cls.color });
  });
  rows.sort(function(a,b){ return b.total-a.total; });
  return rows.map(function(r,i){ return Object.assign({}, r, {rank:i+1}); });
}

/* ---------------------------- Render pipeline ---------------------------- */
function captureFocus(){
  var el = document.activeElement;
  if(!el || el===document.body || !el.id) return null;
  return { id:el.id, start:(typeof el.selectionStart==='number'?el.selectionStart:null), end:(typeof el.selectionEnd==='number'?el.selectionEnd:null) };
}
function restoreFocus(info){
  if(!info) return;
  var el = $id(info.id);
  if(el){
    el.focus();
    if(info.start!==null && el.setSelectionRange){
      try{ el.setSelectionRange(info.start, info.end); }catch(e){}
    }
  }
}
function render(){
  var f = captureFocus();
  $id("root").innerHTML = AppHTML();
  restoreFocus(f);
}

var toastTimer = null;
function notify(msg){

}

function addEntryToLog(label, points, pillar){
  var s = ui.scoring;
  var isAdmin = session.role==='admin';
  if(state.savedWeeks.indexOf(state.currentWeek)!==-1){ deny('Chỉnh sửa tuần đã khóa lịch sử'); return; }
  if(!requireScoreEdit(s.selectedClass, 'Chấm điểm cho Chi đội '+s.selectedClass)) return;
  var entry = { id: Math.random().toString(36).slice(2), pillar:pillar, label:label, points:Number(points), note:s.note||'', by:(isAdmin?'Admin':(session.staffAccount?session.staffAccount.username:'')), time:new Date().toLocaleString('vi-VN') };
  if(!state.logs[state.currentWeek]) state.logs[state.currentWeek] = {};
  if(!state.logs[state.currentWeek][s.selectedClass]) state.logs[state.currentWeek][s.selectedClass] = [];
  state.logs[state.currentWeek][s.selectedClass].push(entry);
  ui.scoring.note = '';
  persist();
  notify('Đã ghi nhận: '+label+' ('+(points>0?'+':'')+points+'đ) cho Chi đội '+s.selectedClass);
}
function addSelectedInfraction(){
  var all = INFRACTIONS.concat(state.customInfractions);
  var found = all.filter(function(f){ return (f.pillar+'||'+f.label)===ui.scoring.pillarFilter; })[0];
  if(found) addEntryToLog(found.label, found.points, found.pillar);
}
function addCustomInfraction(){
  var s = ui.scoring;
  if(!s.customLabel || s.customPoints==='') return;
  var label=s.customLabel, points=Number(s.customPoints), pillar=s.customPillar;
  addEntryToLog(label, points, pillar);
  if(!state.customInfractions.some(function(f){ return f.label===label && f.pillar===pillar; })){
    state.customInfractions = state.customInfractions.concat([{pillar:pillar, label:label, points:points}]);
  }
  ui.scoring.customLabel=''; ui.scoring.customPoints='';
  persist();
}
function setDirectScore(pillar){
  var s = ui.scoring;
  if(state.savedWeeks.indexOf(state.currentWeek)!==-1){ deny('Chỉnh sửa tuần đã khóa lịch sử'); return; }
  var isAdmin = session.role==='admin';
  if(!requireScoreEdit(s.selectedClass, 'Nhập điểm trực tiếp cho Chi đội '+s.selectedClass)) return;
  var raw = s.directInputs? s.directInputs[pillar] : undefined;
  if(raw===undefined || String(raw).trim()===''){ alert('Vui lòng nhập điểm.'); return; }
  var value = Number(raw);
  if(isNaN(value)){ alert('Điểm nhập không hợp lệ.'); return; }
  var max = Number(state.pillarMaxScores[pillar])||0;
  value = Math.max(0, Math.min(max, Math.round(value)));
  var ranking = computeClassScores(state.currentWeek);
  var row = ranking.filter(function(r){ return r.code===s.selectedClass; })[0];
  var current = row? row.pillarScores[pillar] : max;
  var delta = value - current;
  s.directInputs[pillar] = value;
  if(delta===0){ notify('Điểm '+pillar+' không đổi ('+value+'đ).'); return; }
  var entry = { id: Math.random().toString(36).slice(2), pillar:pillar, label:'Nhập điểm trực tiếp', points:delta, note:'Đặt điểm còn '+value+'đ (trước đó '+current+'đ)', by:(isAdmin?'Admin':(session.staffAccount?session.staffAccount.username:'')), time:new Date().toLocaleString('vi-VN') };
  if(!state.logs[state.currentWeek]) state.logs[state.currentWeek] = {};
  if(!state.logs[state.currentWeek][s.selectedClass]) state.logs[state.currentWeek][s.selectedClass] = [];
  state.logs[state.currentWeek][s.selectedClass].push(entry);
  persist();
  notify('Đã cập nhật điểm '+pillar+' cho Chi đội '+s.selectedClass+': '+value+'đ');
}
function deleteEntry(id){
  if(!requireAdmin('Xóa nhật ký chấm điểm')) return;
  if(state.savedWeeks.indexOf(state.currentWeek)!==-1){ deny('Xóa nhật ký của tuần đã lưu (lịch sử)'); return; }
  var wk = state.logs[state.currentWeek];

}

function openWeekManager(){ ui.scoring.weekManagerOpen=true; ui.scoring.weekEditIdx=null; render(); }

function startEditWeek(idx, label){ ui.scoring.weekEditIdx=idx; ui.scoring.weekDraftName=label; render(); }

function renameWeek(oldLabel, newLabelRaw){
  var newLabel = (newLabelRaw||'').trim();
  if(!newLabel){ alert('Tên tuần không được để trống.'); return false; }
  if(newLabel!==oldLabel && state.weeks.indexOf(newLabel)!==-1){ alert('Tuần "'+newLabel+'" đã tồn tại.'); return false; }
  state.weeks = state.weeks.map(function(w){ return w===oldLabel? newLabel : w; });
  if(newLabel!==oldLabel){
    if(state.logs[oldLabel]){ state.logs[newLabel]=state.logs[oldLabel]; delete state.logs[oldLabel]; }
    state.savedWeeks = state.savedWeeks.map(function(w){ return w===oldLabel? newLabel : w; });
    if(state.currentWeek===oldLabel) state.currentWeek=newLabel;
  }
  persist();
  return true;
}
function confirmEditWeek(oldLabel){
  var ok = renameWeek(oldLabel, ui.scoring.weekDraftName);
  if(ok){ ui.scoring.weekEditIdx=null; render(); }
}
function deleteWeek(label){
  if(state.weeks.length<=1){ alert('Phải có ít nhất một tuần thi đua.'); return; }
  if(!confirm('Xóa "'+label+'"? Toàn bộ nhật ký chấm điểm của tuần này sẽ bị xóa vĩnh viễn.')) return;
  state.weeks = state.weeks.filter(function(w){ return w!==label; });
  if(state.logs[label]) delete state.logs[label];
  state.savedWeeks = state.savedWeeks.filter(function(w){ return w!==label; });
  if(state.currentWeek===label){ state.currentWeek = state.weeks[0]; }
  persist();
  render();
}
function addWeek(){
  var name = prompt('Nhập tên tuần mới:', 'Tuần '+(state.weeks.length+1));
  if(!name || !name.trim()) return;
  if(state.weeks.indexOf(name.trim())!==-1){ alert('Tên tuần đã tồn tại.'); return; }
  state.weeks = state.weeks.concat([name.trim()]);
  persist();
  notify('Đã thêm '+name.trim());
}

/* ---------------------------- CSV helpers (không cần thư viện) ---------------------------- */
function toCSV(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = (v===undefined||v===null)? '' : String(v);
      if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
      return v;
    }).join(',');
  }).join('\r\n');
}
function parseCSV(text){
  var lines = text.replace(/\r\n/g,'\n').split('\n').filter(function(l){ return l.trim().length; });
  var rows = [];
  for(var li=0; li<lines.length; li++){
    var line = lines[li], row=[], cur='', q=false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(q){
        if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; }
        else cur+=c;
      } else {
        if(c==='"') q=true;
        else if(c===','){ row.push(cur); cur=''; }
        else cur+=c;
      }
    }
    row.push(cur);
    rows.push(row);
  }
  return rows;
}
function downloadFile(filename, content, mime){
  var blob = new Blob(['\ufeff'+content], { type:(mime||'text/csv')+';charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function exportScoreCSV(){
  var ranking = computeClassScores(state.currentWeek);

  var rows = [header].concat(ranking.map(function(r){
    return [r.rank, r.code, r.gvcn, r.pillarScores['Nề nếp'], r.pillarScores['Vệ sinh'], r.pillarScores['Văn thể'], r.pillarScores['Học tập'], r.total, r.maxTotal, r.label];
  }));
  downloadFile('BangDiemThiDua_'+state.currentWeek.replace(/[^\w]+/g,'_')+'.csv', toCSV(rows));
}
function exportStudentsCSV(list, filename){
  var header = ['Mã Đội viên','Mã định danh Bộ GD&ĐT','Họ và tên','Chi đội','Giới tính','Chức vụ','Ngày sinh','Dân tộc','SĐT liên hệ','Trạng thái'];
  var rows = [header].concat(list.map(function(s){ return [s.id, s.maDinhDanh||'', s.hoTen, s.lop, s.gioiTinh, s.chucVu, s.ngaySinh, s.danToc||'', s.sdt||'', s.trangThai||'']; }));

function handleImportFile(fileList, mode, targetClass){
  var file = fileList && fileList[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var text = e.target.result;
      var rowsOut = [];
      if(/\.json$/i.test(file.name)){
        var data = JSON.parse(text);
        rowsOut = (Array.isArray(data)? data : []).map(function(o){
          return { hoTen:o.hoTen||o.name||'', lop:(o.lop||o.class||targetClass||'').toString().toUpperCase(), gioiTinh:o.gioiTinh||o.gender||'Nam', chucVu:o.chucVu||'Đội viên', ngaySinh:o.ngaySinh||o.dob||'' };
        });
      } else {
        var rows = parseCSV(text);
        if(!rows.length) throw new Error('empty');
        var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
        function idx(k){ for(var i=0;i<header.length;i++){ if(header[i].indexOf(k)>=0) return i; } return -1; }
        var iName = idx('tên')>=0? idx('tên') : 0;
        var iClass = idx('lớp')>=0? idx('lớp') : (idx('chi đội')>=0? idx('chi đội') : 1);
        var iGender = idx('giới');
        var iRole = idx('chức');
        var iDob = idx('sinh');
        rowsOut = rows.slice(1).map(function(cols){
          return {
            hoTen: (cols[iName]||'').trim(),
            lop: (cols[iClass]||targetClass||'').trim().toUpperCase(),
            gioiTinh: (iGender>=0 && cols[iGender])? cols[iGender].trim() : 'Nam',
            chucVu: (iRole>=0 && cols[iRole])? cols[iRole].trim() : 'Đội viên',
            ngaySinh: iDob>=0? (cols[iDob]||'').trim() : ''
          };
        });
      }
      rowsOut = rowsOut.filter(function(s){ return s.hoTen; });
      if(mode==='roster'){ rowsOut = rowsOut.map(function(s){ return Object.assign({}, s, {lop:targetClass}); }); }
      if(!rowsOut.length){ alert('Không tìm thấy dữ liệu hợp lệ trong file.'); return; }
      var stamp = Date.now().toString().slice(-6);
      var newStudents = rowsOut.map(function(s, i){
        return {
          id: 'DVNK'+stamp+i,
          hoTen: s.hoTen,
          lop: s.lop || classCodes()[0],
          gioiTinh: s.gioiTinh==='Nữ'? 'Nữ' : 'Nam',
          chucVu: ['Đội viên','Chi đội trưởng','Chi đội phó'].indexOf(s.chucVu)!==-1? s.chucVu : 'Đội viên',
          ngaySinh: s.ngaySinh || ''
        };
      });
      state.students = newStudents.concat(state.students);
      persist();
      ui.directory.successMsg = 'Đã nhập thành công '+newStudents.length+' bản ghi vào hệ thống.';
      render();
    }catch(err){
      alert('Không đọc được file. Vui lòng dùng file .csv hoặc .json đúng định dạng (có cột Họ và tên, Chi đội).');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

/* ---------------------------- Chỉnh sửa tên Chi đội (đổi tên lớp) ---------------------------- */
function openClassModal(code){
  if(!requireAdmin('Chỉnh sửa thông tin Chi đội')) return;
  var c = findClass(code);
  if(!c) return;
  ui.directory.classModal = { oldCode: code, code: code, gvcn: c.gvcn };
  render();
}
function closeClassModal(){ ui.directory.classModal=null; render(); }
function updateClassModalField(field, val){ if(ui.directory.classModal) ui.directory.classModal[field]=val; }
function saveClassModal(){
  var m = ui.directory.classModal;
  if(!m) return;
  var newCode = (m.code||'').trim();
  var oldCode = m.oldCode;
  var newGvcn = (m.gvcn||'').trim();
  if(!newCode){ alert('Tên Chi đội không được để trống.'); return; }
  if(newCode!==oldCode && classCodes().indexOf(newCode)!==-1){ alert('Tên Chi đội "'+newCode+'" đã tồn tại.'); return; }

  state.classes = state.classes.map(function(c){
    return c.code===oldCode? { code:newCode, khoi:c.khoi, gvcn:newGvcn||c.gvcn } : c;
  });

  if(newCode!==oldCode){
    state.students = state.students.map(function(s){ return s.lop===oldCode? Object.assign({},s,{lop:newCode}) : s; });
    Object.keys(state.logs).forEach(function(week){
      var wk = state.logs[week];
      if(wk && wk[oldCode]){ wk[newCode] = wk[oldCode]; delete wk[oldCode]; }
    });
    state.accounts = state.accounts.map(function(a){ return a.assignedClass===oldCode? Object.assign({},a,{assignedClass:newCode}) : a; });
    if(state.rldv[oldCode]){ state.rldv[newCode] = state.rldv[oldCode]; delete state.rldv[oldCode]; }
    if(ui.directory.classFilter===oldCode) ui.directory.classFilter=newCode;
    if(ui.scoring.selectedClass===oldCode) ui.scoring.selectedClass=newCode;
    if(session.staffAccount && session.staffAccount.assignedClass===oldCode) session.staffAccount.assignedClass=newCode;
  }
  persist();
  ui.directory.classModal=null;
  notify('Đã cập nhật thông tin Chi đội '+newCode);
  render();
}
function ClassModalHTML(){
  var m = ui.directory.classModal;
  return '<div class="modal-overlay" onclick="if(event.target===this) closeClassModal();">'
    + '<div class="modal modal-sm">'
      + '<div class="modal-head"><strong>'+icon('school',17)+' Chỉnh sửa thông tin Chi đội</strong><button class="icon-btn" onclick="closeClassModal()">'+icon('x',18)+'</button></div>'
      + '<div class="modal-body stack">'

        + '<div><label class="label">Giáo viên chủ nhiệm</label><input class="input" id="class-gvcn-input" value="'+esc(m.gvcn)+'" oninput="updateClassModalField(\'gvcn\', this.value)"></div>'
        + '<p style="font-size:11px;color:var(--slate-400);">Đổi tên Chi đội sẽ tự động cập nhật toàn bộ Đội viên, nhật ký chấm điểm, tài khoản phụ trách và Chương trình Rèn luyện Đội viên liên quan.</p>'

/* ---------------------------- Chương trình Rèn luyện Đội viên ---------------------------- */
function getRldv(code){
  if(!state.rldv[code]){
    state.rldv[code] = {
      chuyenHieu: DEFAULT_CHUYEN_HIEU.map(function(n,i){ return { id:'ch'+i, name:n, done:false }; }),
      recognized: false, recognizedDate: '', note: ''
    };
  }
  return state.rldv[code];
}
function canEditRldv(code){
  return session.role==='admin';
}
function toggleChuyenHieu(code, id){
  if(!canEditRldv(code)){ deny('Cập nhật Chương trình Rèn luyện Đội viên'); return; }
  var r = getRldv(code);
  r.chuyenHieu = r.chuyenHieu.map(function(c){ return c.id===id? Object.assign({},c,{done:!c.done}) : c; });
  persist(); render();
}
function addChuyenHieu(code){
  if(!requireAdmin('Thêm chuyên hiệu rèn luyện')) return;
  var name = prompt('Nhập tên chuyên hiệu mới:');
  if(!name || !name.trim()) return;
  var r = getRldv(code);
  r.chuyenHieu = r.chuyenHieu.concat([{ id:'ch'+Date.now(), name:name.trim(), done:false }]);
  persist(); render();
}
function removeChuyenHieu(code, id){
  if(!requireAdmin('Xóa chuyên hiệu rèn luyện')) return;
  var r = getRldv(code);
  r.chuyenHieu = r.chuyenHieu.filter(function(c){ return c.id!==id; });
  persist(); render();
}
function setRldvRecognized(code, val){
  if(!requireAdmin('Công nhận hoàn thành Chương trình Rèn luyện Đội viên')) return;
  var r = getRldv(code);
  r.recognized = val;
  r.recognizedDate = val? new Date().toLocaleDateString('vi-VN') : '';
  persist();
  notify(val? ('Đã công nhận Chi đội '+code+' hoàn thành Chương trình Rèn luyện Đội viên') : ('Đã hủy công nhận Chi đội '+code));
  render();
}

/* ---------------------------- Nghi thức Đội — Tìm hiểu & Học tập ---------------------------- */
function toggleNghiThucSection(idx){
  ui.nghithuc.openIdx = (ui.nghithuc.openIdx===idx? -1 : idx);
  render();
}
function selectQuizAnswer(qIdx, optIdx){
  if(ui.nghithuc.submitted) return;
  ui.nghithuc.quizAnswers[qIdx] = optIdx;
  render();
}
function submitQuiz(){
  var answered = Object.keys(ui.nghithuc.quizAnswers).length;
  if(answered < NGHI_THUC_QUIZ.length){
    if(!confirm('Bạn mới trả lời '+answered+'/'+NGHI_THUC_QUIZ.length+' câu. Vẫn nộp bài?')) return;
  }
  ui.nghithuc.submitted = true;
  render();
}
function resetQuiz(){
  ui.nghithuc.quizAnswers = {};
  ui.nghithuc.submitted = false;
  render();
}
function NghiThucHTML(){
  var n = ui.nghithuc;
  var sectionsHtml = NGHI_THUC_SECTIONS.map(function(sec, idx){
    var open = n.openIdx===idx;
    return '<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px;">'
      + '<button onclick="toggleNghiThucSection('+idx+')" style="width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">'
        + '<span style="font-weight:700;font-size:13.5px;color:var(--slate-800);">'+(idx+1)+'. '+esc(sec.title)+'</span>'
        + icon(open? 'chevronLeft':'chevronRight', 16, '', 'transform:'+(open?'rotate(-90deg)':'rotate(90deg)')+';color:#94a3b8;flex-shrink:0;')
      + '</button>'
      + (open? ('<div style="padding:0 14px 14px;font-size:13px;color:var(--slate-600);line-height:1.6;">'+sec.body+'</div>') : '')
    + '</div>';
  }).join('');

  var score = 0;
  if(n.submitted){
    NGHI_THUC_QUIZ.forEach(function(q, qi){ if(n.quizAnswers[qi]===q.correct) score++; });
  }

  var quizHtml = NGHI_THUC_QUIZ.map(function(q, qi){
    var chosen = n.quizAnswers[qi];
    var optsHtml = q.options.map(function(opt, oi){
      var state_ = '';
      if(n.submitted){
        if(oi===q.correct) state_ = 'border-emerald-500'; // marker only, styled inline below
      }
      var isChosen = chosen===oi;
      var bg = '#fff', border = 'var(--slate-200)', extra = '';
      if(n.submitted){
        if(oi===q.correct){ bg='#ecfdf5'; border='#6ee7b7'; }
        else if(isChosen && oi!==q.correct){ bg='#fef2f2'; border='#fca5a5'; }
      } else if(isChosen){ bg='#eff6ff'; border='#93c5fd'; }
      return '<button onclick="selectQuizAnswer('+qi+','+oi+')" '+(n.submitted?'disabled':'')+' style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid '+border+';background:'+bg+';font-size:12.5px;margin-bottom:5px;cursor:'+(n.submitted?'default':'pointer')+';">'
        + '<span style="width:18px;height:18px;border-radius:50%;border:1.5px solid '+(isChosen||( n.submitted&&oi===q.correct)?'currentColor':'var(--slate-300)')+';display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:'+(n.submitted&&oi===q.correct?'#059669':(isChosen?'#2563eb':'var(--slate-400)'))+';">'+((isChosen||(n.submitted&&oi===q.correct))? icon('check',11):'')+'</span>'
        + '<span>'+esc(opt)+'</span>'
      + '</button>';
    }).join('');
    return '<div style="margin-bottom:16px;">'
      + '<p style="font-weight:600;font-size:13px;color:var(--slate-800);margin:0 0 6px;">Câu '+(qi+1)+'. '+esc(q.q)+'</p>'
      + optsHtml
    + '</div>';
  }).join('');

  return '<div class="stack">'
    + '<div><h2 class="page-title">Nghi thức Đội TNTP Hồ Chí Minh</h2><p class="page-sub">Tìm hiểu và học tập các kỹ năng Nghi thức Đội — dành cho mọi Đội viên, Sao Đỏ và GVCN.</p></div>'
    + '<div class="score-split">'
      + '<div>'
        + '<div class="card" style="margin-bottom:12px;background:var(--emerald-light);border-color:#a7f3d0;">'
          + '<div style="display:flex;align-items:center;gap:8px;font-weight:700;color:#065f46;font-size:13.5px;">'+icon('bookOpen',17)+' Tài liệu tham khảo</div>'
          + '<p style="font-size:12px;color:#047857;margin:4px 0 0;">Nhấn vào từng mục để mở rộng nội dung chi tiết.</p>'
        + '</div>'
        + sectionsHtml
      + '</div>'
      + '<div class="card" style="align-self:start;">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
          + '<strong style="display:flex;align-items:center;gap:7px;font-size:14px;">'+icon('clipboardCheck',17,'','color:#059669')+' Tự kiểm tra kiến thức</strong>'
          + (n.submitted? '<span class="badge" style="'+badgeStyle(score>=NGHI_THUC_QUIZ.length*0.8?'emerald':(score>=NGHI_THUC_QUIZ.length*0.5?'amber':'red'))+'">'+score+'/'+NGHI_THUC_QUIZ.length+' đúng</span>' : '')
        + '</div>'
        + quizHtml
        + (n.submitted
            ? '<button class="btn btn-outline" style="width:100%;justify-content:center;" onclick="resetQuiz()">'+icon('history',15)+' Làm lại bài kiểm tra</button>'
            : '<button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitQuiz()">'+icon('check',15)+' Nộp bài</button>')
      + '</div>'
    + '</div>'
  + '</div>';
}

function togglePwVisible(id){ ui.accounts.visiblePw[id]=!ui.accounts.visiblePw[id]; render(); }
function submitNewAccount(){
  var f = ui.accounts.form;
  ui.accounts.error='';
  if(!f.username.trim()){ ui.accounts.error='Vui lòng nhập tên đăng nhập.'; render(); return; }
  if(state.accounts.some(function(x){ return x.username===f.username; })){ ui.accounts.error='Tên đăng nhập đã tồn tại.'; render(); return; }
  if(!f.assignedClass){ ui.accounts.error='Vui lòng chọn Chi đội phụ trách.'; render(); return; }
  if(f.loai!=='saodo' && f.loai!=='gvcn'){ ui.accounts.error='Vui lòng chọn loại tài khoản.'; render(); return; }
  if(state.accounts.some(function(x){ return x.assignedClass===f.assignedClass && x.loai===f.loai; })){
    ui.accounts.error='Chi đội '+f.assignedClass+' đã có tài khoản '+(f.loai==='saodo'?'Sao Đỏ':'GVCN')+'.';
    render(); return;
  }
  if(f.password.length<6){ ui.accounts.error='Mật khẩu cần tối thiểu 6 ký tự.'; render(); return; }
  if(f.password!==f.confirm){ ui.accounts.error='Xác nhận mật khẩu không khớp.'; render(); return; }
  var acc = { id:'TK'+Math.floor(100+rand()*899), username:f.username.trim(), password:f.password, assignedClass:f.assignedClass, loai:f.loai, createdAt:new Date().toLocaleDateString('vi-VN') };
  state.accounts = state.accounts.concat([acc]);
  persist();
  notify('Đã tạo tài khoản '+acc.username+' ('+(f.loai==='saodo'?'Sao Đỏ':'GVCN')+') phụ trách Chi đội '+acc.assignedClass);
  ui.accounts.form = { username:'', assignedClass: classCodes()[0]||'', password:'', confirm:'', loai:'saodo' };
  render();
}
function askDeleteAccount(id){ ui.accounts.confirmDelete = state.accounts.filter(function(a){ return a.id===id; })[0]; render(); }
function confirmDeleteAccount(){
  var acc = ui.accounts.confirmDelete;
  state.accounts = state.accounts.filter(function(a){ return a.id!==acc.id; });
  persist();
  ui.accounts.confirmDelete=null;
  notify('Đã xóa tài khoản '+acc.username);
  render();
}
function ConfirmDeleteAccountModalHTML(){
  var acc = ui.accounts.confirmDelete;
  return '<div class="modal-overlay" onclick="if(event.target===this){ui.accounts.confirmDelete=null; render();}">'
    + '<div class="modal modal-sm">'
      + '<div class="modal-head"><strong>'+icon('trash',17)+' Xác nhận xóa tài khoản</strong><button class="icon-btn" onclick="ui.accounts.confirmDelete=null; render();">'+icon('x',18)+'</button></div>'
      + '<div class="modal-body">'
        + '<p style="font-size:13px;color:var(--slate-600);">Xóa tài khoản <strong>'+esc(acc.username)+'</strong> phụ trách Chi đội '+acc.assignedClass+'?</p>'
        + '<div class="row" style="margin-top:14px;"><button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="ui.accounts.confirmDelete=null; render();">Hủy</button><button class="btn btn-danger" style="flex:1;justify-content:center;" onclick="confirmDeleteAccount()">Xóa</button></div>'
      + '</div>'
    + '</div>'
  + '</div>';
}
function AccountsHTML(){
  var a = ui.accounts;
  var classOpts = classCodes().map(function(c){
    var used = state.accounts.some(function(x){ return x.assignedClass===c && x.loai===a.form.loai; });
    return '<option value="'+c+'" '+(used?'disabled':'')+' '+(c===a.form.assignedClass?'selected':'')+'>'+c+(used?' (đã có '+(a.form.loai==='saodo'?'Sao Đỏ':'GVCN')+')':'')+'</option>';
  }).join('');
  var rows = state.accounts.map(function(acc){
    var loaiLabel = acc.loai==='saodo'? 'Sao Đỏ' : 'GVCN';
    var loaiStyle = acc.loai==='saodo'? badgeStyle('amber') : badgeStyle('emerald');
    return '<tr>'
      + '<td style="font-weight:600;">'+esc(acc.username)+'</td>'
      + '<td><span class="badge" style="'+loaiStyle+'">'+loaiLabel+'</span></td>'
      + '<td><span class="badge" style="'+badgeStyle('blue')+'">'+acc.assignedClass+'</span></td>'
      + '<td style="font-family:Consolas,monospace;font-size:12px;"><span>'+(a.visiblePw[acc.id]? esc(acc.password) : '•'.repeat(acc.password.length))+'</span> <button class="icon-btn" style="padding:2px;" onclick="togglePwVisible(\''+acc.id+'\')">'+icon(a.visiblePw[acc.id]?'eyeOff':'eye',13)+'</button></td>'
      + '<td class="hide-sm" style="font-size:11px;color:var(--slate-500);">'+acc.createdAt+'</td>'
      + '<td style="text-align:right;"><button class="icon-btn danger" onclick="askDeleteAccount(\''+acc.id+'\')">'+icon('trash',14)+'</button></td>'
    + '</tr>';
  }).join('');
  return '<div class="stack">'
    + '<div><h2 class="page-title">Quản lý Tài khoản Con</h2><p class="page-sub">Khu vực chỉ dành cho Tổng phụ trách Đội — tạo và cấu hình tài khoản Sao Đỏ / GVCN. Mỗi Chi đội có thể có tối đa 1 tài khoản Sao Đỏ và 1 tài khoản GVCN.</p></div>'
    + '<div class="dash-split">'
      + '<div class="card stack">'
        + '<strong style="display:flex;align-items:center;gap:7px;">'+icon('userPlus',16)+' Tạo tài khoản mới</strong>'
        + '<div><label class="label">Loại tài khoản</label><select class="select" onchange="ui.accounts.form.loai=this.value; render();">'
          + '<option value="saodo" '+(a.form.loai==='saodo'?'selected':'')+'>Sao Đỏ — chấm điểm theo tiêu chí</option>'
          + '<option value="gvcn" '+(a.form.loai==='gvcn'?'selected':'')+'>GVCN — sửa/xóa Đội viên lớp mình</option>'
        + '</select></div>'
        + '<div><label class="label">Tên đăng nhập</label><input class="input" id="acc-username-input" placeholder="vd: saodo.6.2" value="'+esc(a.form.username)+'" oninput="ui.accounts.form.username=this.value;"></div>'
        + '<div><label class="label">Chi đội phụ trách</label><select class="select" onchange="ui.accounts.form.assignedClass=this.value;">'+classOpts+'</select></div>'
        + '<div><label class="label">Thiết lập mật khẩu đăng nhập</label><input class="input" id="acc-password-input" type="password" placeholder="Tối thiểu 6 ký tự" value="'+esc(a.form.password)+'" oninput="ui.accounts.form.password=this.value;"></div>'
        + '<div><label class="label">Xác nhận mật khẩu</label><input class="input" id="acc-confirm-input" type="password" value="'+esc(a.form.confirm)+'" oninput="ui.accounts.form.confirm=this.value;"></div>'
        + (a.error? '<p style="font-size:12px;color:#dc2626;">'+icon('alertTriangle',12)+' '+esc(a.error)+'</p>' : '')
        + '<button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitNewAccount()">Tạo tài khoản</button>'
      + '</div>'
      + '<div class="card" style="grid-column:1/-1;">'
        + '<strong>Danh sách tài khoản đang hoạt động ('+state.accounts.length+')</strong>'
        + '<div class="tbl-wrap" style="margin-top:10px;"><table><thead><tr><th>Tài khoản</th><th>Loại</th><th>Chi đội</th><th>Mật khẩu</th><th class="hide-sm">Ngày tạo</th><th style="text-align:right;">Thao tác</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '</div>'
    + '</div>'
  + '</div>'
  + (a.confirmDelete? ConfirmDeleteAccountModalHTML() : '');
}

/* ---------------------------- Tài liệu ---------------------------- */
function submitNewDocument(){
  var f = ui.documents.form;
  ui.documents.error = '';
  if(!f.title.trim()){ ui.documents.error = 'Vui lòng nhập tên tài liệu.'; render(); return; }
  var isAdmin = session.role==='admin';
  var doc = {
    id: 'TL'+Math.floor(1000+rand()*8999),
    title: f.title.trim(),
    category: f.category || DOC_CATEGORIES[0],
    url: (f.url||'').trim(),
    note: (f.note||'').trim(),
    addedBy: isAdmin? 'Admin' : (session.staffAccount? session.staffAccount.username : ''),
    addedAt: new Date().toLocaleDateString('vi-VN')
  };
  state.documents = state.documents.concat([doc]);
  persist();
  notify('Đã thêm tài liệu: '+doc.title);
  ui.documents.form = { title:'', category:DOC_CATEGORIES[0], url:'', note:'' };
  render();
}
function askDeleteDocument(id){
  if(!requireAdmin('Xóa tài liệu')) return;
  ui.documents.confirmDelete = state.documents.filter(function(x){ return x.id===id; })[0];
  render();
}
function confirmDeleteDocument(){
  var doc = ui.documents.confirmDelete;
  state.documents = state.documents.filter(function(x){ return x.id!==doc.id; });
  persist();
  ui.documents.confirmDelete = null;
  notify('Đã xóa tài liệu '+doc.title);
  render();
}
function ConfirmDeleteDocumentModalHTML(){
  var doc = ui.documents.confirmDelete;
  return '<div class="modal-overlay" onclick="if(event.target===this){ui.documents.confirmDelete=null; render();}">'
    + '<div class="modal modal-sm">'
      + '<div class="modal-head"><strong>'+icon('trash',17)+' Xác nhận xóa tài liệu</strong><button class="icon-btn" onclick="ui.documents.confirmDelete=null; render();">'+icon('x',18)+'</button></div>'
      + '<div class="modal-body">'
        + '<p style="font-size:13px;color:var(--slate-600);">Xóa tài liệu <strong>'+esc(doc.title)+'</strong>?</p>'
        + '<div class="row" style="margin-top:14px;"><button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="ui.documents.confirmDelete=null; render();">Hủy</button><button class="btn btn-danger" style="flex:1;justify-content:center;" onclick="confirmDeleteDocument()">Xóa</button></div>'
      + '</div>'
    + '</div>'
  + '</div>';
}
function DocumentsHTML(){
  var isAdmin = session.role==='admin';
  var d = ui.documents;
  var filtered = state.documents.filter(function(x){ return d.categoryFilter==='Tất cả' || x.category===d.categoryFilter; });
  var catOpts = ['Tất cả'].concat(DOC_CATEGORIES).map(function(c){
    return '<option value="'+esc(c)+'" '+(c===d.categoryFilter?'selected':'')+'>'+esc(c)+'</option>';
  }).join('');
  var catFormOpts = DOC_CATEGORIES.map(function(c){
    return '<option value="'+esc(c)+'" '+(c===d.form.category?'selected':'')+'>'+esc(c)+'</option>';
  }).join('');
  var rows = filtered.length===0
    ? '<p style="font-size:12px;color:var(--slate-400);font-style:italic;padding:14px 0;">Chưa có tài liệu nào'+(d.categoryFilter!=='Tất cả'? (' trong mục "'+esc(d.categoryFilter)+'"') : '')+'.</p>'
    : filtered.map(function(x){
        return '<div class="card" style="padding:12px;">'
          + '<div class="row-between">'
            + '<div style="min-width:0;">'
              + '<span class="badge" style="'+docBadgeStyle(x.category)+'">'+esc(x.category)+'</span>'
              + '<p style="font-weight:700;margin:6px 0 2px;">'+esc(x.title)+'</p>'
              + (x.note? '<p style="font-size:12px;color:var(--slate-500);margin:0;">'+esc(x.note)+'</p>' : '')
              + '<p style="font-size:10.5px;color:var(--slate-400);margin:6px 0 0;">Thêm bởi '+esc(x.addedBy)+' · '+esc(x.addedAt)+'</p>'
            + '</div>'
            + '<div style="display:flex;gap:6px;flex-shrink:0;align-items:flex-start;">'
              + (x.url? '<a class="btn btn-outline" style="font-size:12px;" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+icon('link2',13)+' Mở liên kết</a>' : '')
              + (isAdmin? '<button class="icon-btn danger" onclick="askDeleteDocument(\''+x.id+'\')">'+icon('trash',14)+'</button>' : '')
            + '</div>'
          + '</div>'
        + '</div>';
      }).join('');
  return '<div class="stack">'
    + '<div><h2 class="page-title">Tài liệu</h2><p class="page-sub">Kho tài liệu, văn bản, biểu mẫu dùng chung cho Liên đội — Chi đội trưởng, Sao Đỏ, GVCN đều có thể xem.</p></div>'
    + (isAdmin? (
      '<div class="card stack">'
        + '<strong style="display:flex;align-items:center;gap:7px;">'+icon('plus',16)+' Thêm tài liệu mới</strong>'
        + '<div><label class="label">Tên tài liệu</label><input class="input" id="doc-title-input" placeholder="vd: Kế hoạch công tác Đội tháng 10" value="'+esc(d.form.title)+'" oninput="ui.documents.form.title=this.value;"></div>'
        + '<div class="field-grid-2">'
          + '<div><label class="label">Phân loại</label><select class="select" onchange="ui.documents.form.category=this.value;">'+catFormOpts+'</select></div>'
          + '<div><label class="label">Liên kết (URL, tùy chọn)</label><input class="input" id="doc-url-input" placeholder="https://..." value="'+esc(d.form.url)+'" oninput="ui.documents.form.url=this.value;"></div>'
        + '</div>'
        + '<div><label class="label">Ghi chú (tùy chọn)</label><input class="input" id="doc-note-input" placeholder="Mô tả ngắn về tài liệu" value="'+esc(d.form.note)+'" oninput="ui.documents.form.note=this.value;"></div>'
        + (d.error? '<p style="font-size:12px;color:#dc2626;">'+icon('alertTriangle',12)+' '+esc(d.error)+'</p>' : '')
        + '<button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitNewDocument()">'+icon('plus',15)+' Thêm tài liệu</button>'
      + '</div>'
    ) : '')
    + '<div class="row-between">'
      + '<strong style="font-size:14px;">Danh sách tài liệu ('+filtered.length+')</strong>'
      + '<select class="select" style="width:auto;" onchange="ui.documents.categoryFilter=this.value; render();">'+catOpts+'</select>'
    + '</div>'
    + '<div class="stack" style="gap:10px;">'+rows+'</div>'
  + '</div>'
  + (d.confirmDelete? ConfirmDeleteDocumentModalHTML() : '');
}

/* ---------------------------- Khởi động ---------------------------- */
render();
</script>
</body>
</html>
